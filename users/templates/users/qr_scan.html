{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scan - Manavargal School Management</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500&display=swap');

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Poppins', sans-serif;
        font-weight: 400;
        background: var(--white);
        min-height: 100vh;
        color: var(--text-color);
        padding-top: 100px;
        padding-bottom: 40px;
    }

    h1, h2, h3 {
        font-family: 'Montserrat', sans-serif;
        text-align: center;
    }

    :root {
        --primary-color: #00a676;
        --primary-hover: #00b88d;
        --danger-color: #dc2626;
        --danger-hover: #ef4444;
        --sidebar-bg: #f0f9f4;
        --sidebar-border: #a8d5c2;
        --white: #ffffff;
        --light-bg: #f8f9fa;
        --border-color: #adb5bd;
        --text-color: #495057;
        --text-light: #868e96;
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        --border-radius: 16px;
        --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html {
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
        overflow-x: hidden;
    }

    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
    }

    .header {
        background: var(--white);
        color: var(--text-color);
        padding: 0.75rem 1rem;
        border-bottom: 2px solid var(--border-color);
        box-shadow: var(--shadow-md);
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
    }

    .header h1 {
        font-size: 1.75rem;
        font-weight: 700;
        text-align: center;
        flex-grow: 1;
        color: var(--primary-color);
        margin: 0;
        margin-left: -10%;
    }

    .back-btn {
        padding: 0.6rem 1.2rem;
        border: 2px solid var(--border-color);
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
        background: var(--sidebar-bg);
        color: var(--text-color);
        text-decoration: none;
        transition: var(--transition);
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        white-space: nowrap;
    }

    .back-btn:hover {
        background: var(--primary-color);
        color: var(--white);
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
    }

    .logo-container {
        width: 90px;
        height: 70px;
        background: var(--white);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        transition: var(--transition);
        box-shadow: var(--shadow-sm);
        border: 2px solid var(--sidebar-border);
        flex-shrink: 0;
    }

    .logo-container img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        transition: var(--transition);
    }

    .logo-container:hover {
        transform: scale(1.05);
        box-shadow: var(--shadow-md);
    }

    .main-content {
        background: var(--white);
        border: 2px solid var(--border-color);
        border-radius: var(--border-radius);
        box-shadow: var(--shadow-sm);
        padding: 2rem;
        margin-top: 20px;
    }

    .alert-message {
        margin-bottom: 1.5rem;
    }

    .alert-message .error {
        background: #fef2f2;
        color: #dc3545;
        padding: 0.75rem;
        border-radius: 8px;
        border-left: 4px solid #dc3545;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        border: 2px solid var(--border-color);
    }

    .alert-message .success {
        background: #d4edda;
        color: var(--primary-color);
        padding: 0.75rem;
        border-radius: 8px;
        border-left: 4px solid var(--primary-color);
        display: flex;
        align-items: center;
        gap: 0.5rem;
        border: 2px solid var(--border-color);
    }

    .section {
        background: var(--light-bg);
        padding: 1.5rem;
        border-radius: 12px;
        border: 2px solid var(--border-color);
        box-shadow: var(--shadow-sm);
        margin-bottom: 2rem;
        transition: var(--transition);
    }

    .section:hover {
        box-shadow: var(--shadow-md);
    }

    h2 {
        color: var(--primary-color);
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 1.5rem;
        text-align: center;
    }

    .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1rem;
        margin-bottom: 1.5rem;
        background: var(--white);
        padding: 1.5rem;
        border-radius: 12px;
        border: 2px solid var(--border-color);
        box-shadow: var(--shadow-sm);
    }

    .controls button {
        padding: 0.75rem 1.5rem;
        background: var(--primary-color);
        border: none;
        border-radius: 8px;
        color: var(--white);
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
        transition: var(--transition);
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
    }

    .controls button:hover {
        background: var(--primary-hover);
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
    }

    .controls input[type="file"] {
        padding: 0.75rem;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 0.95rem;
        background: var(--white);
        color: var(--text-color);
        cursor: pointer;
        transition: var(--transition);
    }

    .controls input[type="file"]:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(0, 166, 118, 0.1);
        outline: none;
    }

    #video, #canvas {
        width: 100%;
        max-width: 450px;
        margin: 1.5rem auto;
        border-radius: 12px;
        display: block;
        box-shadow: var(--shadow-md);
        border: 2px solid var(--border-color);
    }

    #student-data {
        margin-top: 2rem;
        padding: 1.5rem;
        border-radius: 12px;
        background: var(--white);
        border: 2px solid var(--border-color);
        box-shadow: var(--shadow-sm);
        animation: fadeIn 0.5s ease;
    }

    .student-info-header {
        text-align: center;
        margin-bottom: 2rem;
        border-bottom: 3px solid var(--primary-color);
        padding-bottom: 1rem;
    }

    .student-info-header h2 {
        color: var(--primary-color);
        font-size: 1.5rem;
        font-weight: 600;
        margin: 0 0 0.5rem 0;
    }

    .student-info-header .school-name {
        color: var(--text-light);
        font-size: 1rem;
        margin: 0.3rem 0;
    }

    .profile-section {
        text-align: center;
        margin: 1.5rem 0;
    }

    .profile-pic {
        width: 130px;
        height: 130px;
        border-radius: 12px;
        object-fit: cover;
        margin: 1rem auto;
        display: block;
        border: 3px solid var(--primary-color);
        box-shadow: var(--shadow-md);
    }

    .info-section {
        margin: 1.5rem 0;
    }

    .section-title {
        background: var(--light-bg);
        color: var(--primary-color);
        padding: 0.75rem 1rem;
        margin: 1.5rem 0 1rem 0;
        font-size: 1.1rem;
        font-weight: 600;
        border-radius: 8px;
        border: 2px solid var(--border-color);
    }

    .info-row {
        display: flex;
        flex-wrap: wrap;
        margin: 0.75rem 0;
        padding: 0.75rem;
        background: var(--light-bg);
        border-radius: 8px;
        border: 1px solid var(--border-color);
    }

    .info-label {
        font-weight: 600;
        color: var(--primary-color);
        min-width: 160px;
        flex-shrink: 0;
    }

    .info-value {
        color: var(--text-color);
        flex-grow: 1;
        word-wrap: break-word;
    }

    #download-btn {
        display: none;
        padding: 0.75rem 1.5rem;
        margin: 2rem auto 0;
        background: var(--primary-color);
        border: none;
        border-radius: 8px;
        color: var(--white);
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        transition: var(--transition);
        width: fit-content;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
    }

    #download-btn:hover {
        background: var(--primary-hover);
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
    }

    .loading, .error {
        text-align: center;
        padding: 1.5rem;
        border-radius: 12px;
        margin: 1.5rem 0;
        font-size: 1rem;
    }

    .loading {
        color: var(--primary-color);
        background: var(--light-bg);
        border: 2px solid var(--border-color);
    }

    .error {
        color: #dc3545;
        background: #fef2f2;
        border: 2px solid var(--border-color);
        border-left: 4px solid #dc3545;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .scroll-top-btn {
        position: fixed;
        bottom: 1.5rem;
        right: 1.5rem;
        background: var(--primary-color);
        color: var(--white);
        padding: 1rem;
        border-radius: 50px;
        box-shadow: var(--shadow-md);
        transition: var(--transition);
        z-index: 1000;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        width: 50px;
        height: 50px;
        border: none;
        cursor: pointer;
    }

    .scroll-top-btn:hover {
        background: var(--primary-hover);
        transform: translateY(-2px);
        box-shadow: var(--shadow-lg);
    }

    .scroll-top-btn.show {
        display: flex;
    }

    /* Remove underline from all button links */
    .back-btn {
        text-decoration: none !important;
    }

    @media (max-width: 768px) {
        body {
            padding-top: 140px;
        }

        .header {
            flex-wrap: wrap;
            padding: 0.75rem;
            gap: 0.75rem;
        }

        .header h1 {
            font-size: 1.25rem;
            order: 1;
            width: 100%;
            margin-left: 0;
        }

        .back-btn {
            order: 2;
            flex: 1;
            justify-content: center;
            padding: 0.6rem 1rem;
            font-size: 0.9rem;
        }

        .logo-container {
            order: 3;
            width: 60px;
            height: 50px;
        }

        .container {
            padding: 0 15px;
        }

        .main-content {
            padding: 1.5rem;
        }

        .controls {
            flex-direction: column;
            align-items: stretch;
        }

        .controls button, .controls input[type="file"] {
            width: 100%;
            justify-content: center;
        }

        #video, #canvas {
            max-width: 100%;
        }

        .info-row {
            flex-direction: column;
        }

        .info-label {
            min-width: auto;
        }

        #download-btn {
            width: 100%;
        }
    }

    @media (max-width: 480px) {
        body {
            padding-top: 160px;
        }

        .header h1 {
            font-size: 1.1rem;
        }

        .logo-container {
            width: 50px;
            height: 45px;
        }

        .main-content {
            padding: 1rem;
        }

        .section {
            padding: 1rem;
        }

        .profile-pic {
            width: 100px;
            height: 100px;
        }

        .scroll-top-btn {
            bottom: 0.75rem;
            right: 0.75rem;
            width: 40px;
            height: 40px;
            font-size: 1rem;
        }
    }

    @media (hover: none) {
        .section:hover, .controls button:hover, .back-btn:hover, .scroll-top-btn:hover {
            transform: none;
            box-shadow: var(--shadow-sm);
        }
    }

    @media (prefers-reduced-motion: reduce) {
        * {
            transition: none !important;
            animation: none !important;
        }

        html {
            scroll-behavior: auto;
        }
    }
</style>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
</head>
<body>
    <header class="header">
        <a href="{% url 'admin_master' %}" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back To Master data
        </a>
        <h1><i class="fas fa-qrcode"></i> Scan QR Code</h1>
        <a href="/admin_page/">
            <div class="logo-container">
                <img src="{% static 'users/images/greenlogo.png' %}" alt="Manavargal Logo">
            </div>
        </a>
    </header>
    <div class="container">
        <main class="main-content">
            <section class="section">
                <h2><i class="fas fa-camera"></i> QR Code Scanner</h2>
                <div class="controls">
                    <button id="start-camera">
                        <i class="fas fa-video"></i> Start Camera
                    </button>
                    <input type="file" id="file-upload" accept="image/jpeg,image/png,application/pdf">
                </div>
                <video id="video" autoplay></video>
                <canvas id="canvas"></canvas>
                <div id="student-data"></div>
                <button id="download-btn">
                    <i class="fas fa-download"></i> Download PDF Report
                </button>
            </section>
        </main>
    </div>
    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startCameraBtn = document.getElementById('start-camera');
        const fileUpload = document.getElementById('file-upload');
        const studentDataDiv = document.getElementById('student-data');
        const downloadBtn = document.getElementById('download-btn');
        let isScanning = false;

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.worker.min.js';

        async function qr_data_retrieval(source) {
            try {
                studentDataDiv.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Processing...</div>';
                downloadBtn.style.display = 'none';
                
                if (source === 'camera') {
                    if (isScanning) return;
                    isScanning = true;
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                    video.srcObject = stream;
                    video.style.display = 'block';
                    canvas.style.display = 'none';
                    
                    await new Promise(resolve => {
                        video.onloadedmetadata = () => {
                            video.play();
                            resolve();
                        };
                    });
                    
                    const scanFromVideo = () => {
                        if (!isScanning) return;
                        if (video.videoWidth === 0 || video.videoHeight === 0) {
                            requestAnimationFrame(scanFromVideo);
                            return;
                        }
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const code = jsQR(imageData.data, canvas.width, canvas.height);
                        if (code) {
                            isScanning = false;
                            video.srcObject.getTracks().forEach(track => track.stop());
                            video.style.display = 'none';
                            fetchStudentData(code.data);
                        } else {
                            requestAnimationFrame(scanFromVideo);
                        }
                    };
                    scanFromVideo();
                } else if (source === 'file') {
                    const file = fileUpload.files[0];
                    if (!file) {
                        studentDataDiv.innerHTML = '<div class="error"><i class="fas fa-exclamation-circle"></i> No file selected.</div>';
                        return;
                    }
                    const fileType = file.type;
                    if (fileType === 'application/pdf') {
                        const arrayBuffer = await file.arrayBuffer();
                        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                        let qrCodeFound = false;
                        for (let pageNum = 1; pageNum <= pdf.numPages && !qrCodeFound; pageNum++) {
                            const page = await pdf.getPage(pageNum);
                            const viewport = page.getViewport({ scale: 2.0 });
                            canvas.width = viewport.width;
                            canvas.height = viewport.height;
                            await page.render({
                                canvasContext: ctx,
                                viewport: viewport
                            }).promise;
                            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                            const code = jsQR(imageData.data, canvas.width, canvas.height);
                            if (code) {
                                qrCodeFound = true;
                                video.style.display = 'none';
                                canvas.style.display = 'block';
                                fetchStudentData(code.data);
                            }
                        }
                        if (!qrCodeFound) {
                            studentDataDiv.innerHTML = '<div class="error"><i class="fas fa-exclamation-circle"></i> No QR code found in PDF.</div>';
                            canvas.style.display = 'none';
                        }
                    } else if (fileType === 'image/jpeg' || fileType === 'image/png') {
                        const img = new Image();
                        img.onload = () => {
                            canvas.width = img.width;
                            canvas.height = img.height;
                            ctx.drawImage(img, 0, 0);
                            video.style.display = 'none';
                            canvas.style.display = 'block';
                            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                            const code = jsQR(imageData.data, canvas.width, canvas.height);
                            if (code) {
                                fetchStudentData(code.data);
                            } else {
                                studentDataDiv.innerHTML = '<div class="error"><i class="fas fa-exclamation-circle"></i> No QR code found in image.</div>';
                                canvas.style.display = 'none';
                            }
                        };
                        img.src = URL.createObjectURL(file);
                    } else {
                        studentDataDiv.innerHTML = '<div class="error"><i class="fas fa-exclamation-circle"></i> Unsupported file type. Please use JPEG, PNG, or PDF.</div>';
                    }
                }
            } catch (err) {
                isScanning = false;
                if (video.srcObject) video.srcObject.getTracks().forEach(track => track.stop());
                studentDataDiv.innerHTML = `<div class="error"><i class="fas fa-exclamation-circle"></i> Error: ${err.message}</div>`;
                canvas.style.display = 'none';
            }
        }

        async function fetchStudentData(url) {
            try {
                studentDataDiv.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Fetching student data...</div>';
                
                const response = await fetch('/scan_qr/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({ url })
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    studentDataDiv.innerHTML = `<div class="error"><i class="fas fa-exclamation-circle"></i> Error ${response.status}: ${errorText}</div>`;
                    return;
                }
                
                const data = await response.json();
                if (data.error) {
                    studentDataDiv.innerHTML = `<div class="error"><i class="fas fa-exclamation-circle"></i> ${data.error}</div>`;
                } else {
                    displayStudentData(data);
                    downloadBtn.style.display = 'block';
                }
            } catch (err) {
                studentDataDiv.innerHTML = `<div class="error"><i class="fas fa-exclamation-circle"></i> Error fetching data: ${err.message}</div>`;
            }
        }

        function displayStudentData(data) {
    const formatValue = (value) => value && value !== 'None' && value !== 'N/A' ? value : 'N/A';

    studentDataDiv.innerHTML = `
        <div class="student-info-header">
            <h2><i class="fas fa-user-graduate"></i> Student Information</h2>
            <div class="school-name">Manavargal School Management System</div>
            <div class="school-name">Generated on: ${new Date().toLocaleDateString()}</div>
        </div>
        
        <div class="profile-section">
            ${data.profile_picture ? 
                `<img src="${data.profile_picture}" class="profile-pic" alt="Profile Picture" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                 <div style="display: none; text-align: center; color: var(--text-light); padding: 1.5rem; border: 2px dashed var(--border-color); margin: 1rem 0; border-radius: 8px;"><i class="fas fa-user"></i> Profile picture not available</div>` : 
                `<div style="text-align: center; color: var(--text-light); padding: 1.5rem; border: 2px dashed var(--border-color); margin: 1rem 0; border-radius: 8px;"><i class="fas fa-user"></i> No profile picture available</div>`
            }
        </div>
        
        <div class="info-section">
            <div class="section-title"><i class="fas fa-info-circle"></i> Basic Information</div>
            <div class="info-row">
                <div class="info-label"><i class="fas fa-user"></i> Name:</div>
                <div class="info-value">${formatValue(data.name)}</div>
            </div>
            <div class="info-row">
                <div class="info-label"><i class="fas fa-id-card"></i> Admission Number:</div>
                <div class="info-value">${formatValue(data.admission_number)}</div>
            </div>
            <div class="info-row">
                <div class="info-label"><i class="fas fa-graduation-cap"></i> Class:</div>
                <div class="info-value">${formatValue(data.class)}-${formatValue(data.section)}</div>
            </div>
            <div class="info-row">
                <div class="info-label"><i class="fas fa-hashtag"></i> Roll Number:</div>
                <div class="info-value">${formatValue(data.roll_number)}</div>
            </div>
            <div class="info-row">
                <div class="info-label"><i class="fas fa-code"></i> EMIS:</div>
                <div class="info-value">${formatValue(data.emis)}</div>
            </div>
            <div class="info-row">
                <div class="info-label"><i class="fas fa-envelope"></i> Email:</div>
                <div class="info-value">${formatValue(data.email)}</div>
            </div>
        </div>

        <div class="info-section">
            <div class="section-title"><i class="fas fa-user"></i> Personal Details</div>
            <div class="info-row">
                <div class="info-label"><i class="fas fa-venus-mars"></i> Gender:</div>
                <div class="info-value">${formatValue(data.gender)}</div>
            </div>
            <div class="info-row">
                <div class="info-label"><i class="fas fa-birthday-cake"></i> Date of Birth:</div>
                <div class="info-value">${formatValue(data.dob)}</div>
            </div>
            <div class="info-row">
                <div class="info-label"><i class="fas fa-font"></i> Tamil Name:</div>
                <div class="info-value">${formatValue(data.tamil_name)}</div>
            </div>

        downloadBtn.addEventListener('click', async () => {
            try {
                downloadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating PDF...';
                downloadBtn.disabled = true;
                
                const response = await fetch('/download_student_pdf/', {
                    method: 'GET',
                    headers: {
                        'X-CSRFToken': getCookie('csrftoken')
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                
                // Get filename from response headers or use default
                const contentDisposition = response.headers.get('Content-Disposition');
                let filename = 'student_details.pdf';
                if (contentDisposition) {
                    const filenameMatch = contentDisposition.match(/filename="(.+)"/);
                    if (filenameMatch) {
                        filename = filenameMatch[1];
                    }
                }
                
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
            } catch (error) {
                console.error('PDF download error:', error);
                alert('Error downloading PDF. Please try again.');
            } finally {
                downloadBtn.innerHTML = '<i class="fas fa-download"></i> Download PDF Report';
                downloadBtn.disabled = false;
            }
        });

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
