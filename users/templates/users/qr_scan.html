{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scan - Manavargal School Management</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            font-weight: 400;
            background: var(--white);
            min-height: 100vh;
            color: var(--text-color);
            padding: 80px 20px 40px 20px;
        }

        h1, h2, h3 {
            font-family: 'Montserrat', sans-serif;
        }

        :root {
            --primary-color: #00a676;
            --primary-hover: #00b88d;
            --sidebar-bg: #f0f9f4;
            --sidebar-border: #d1e7dd;
            --white: #ffffff;
            --light-bg: #f8f9fa;
            --border-color: #e9ecef;
            --text-color: #495057;
            --text-light: #868e96;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --border-radius: 16px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            overflow-x: hidden;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            background: var(--white);
            color: var(--text-color);
            padding: 0.5rem 1rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: var(--border-radius) var(--border-radius) 0 0;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            flex-grow: 1;
            color: var(--primary-color);
        }

        .back-btn {
            padding: 0.8rem 1.5rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            background: var(--sidebar-bg);
            color: var(--text-color);
            text-decoration: none;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-btn:hover {
            background: var(--primary-color);
            color: var(--white);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .logo-img {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            object-fit: cover;
            border: none;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .logo-img:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-md);
        }

        .main-content {
            background: var(--white);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-sm);
            padding: 2rem;
            margin-top: 80px;
        }

        .alert-message {
            margin-bottom: 1.5rem;
        }

        .alert-message .error {
            background: #fef2f2;
            color: #dc3545;
            padding: 0.75rem;
            border-radius: 8px;
            border-left: 4px solid #dc3545;
        }

        .alert-message .success {
            background: #f0f9f4;
            color: var(--primary-color);
            padding: 0.75rem;
            border-radius: 8px;
            border-left: 4px solid var(--primary-color);
        }

        .alert-message .warning {
            background: #fff3cd;
            color: #856404;
            padding: 0.75rem;
            border-radius: 8px;
            border-left: 4px solid #ffc107;
        }

        .section {
            background: var(--light-bg);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            margin-bottom: 2rem;
            transition: var(--transition);
        }

        .section:hover {
            box-shadow: var(--shadow-md);
        }

        h2 {
            color: var(--primary-color);
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            background: var(--white);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .controls button {
            padding: 0.8rem 1.5rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            background: var(--sidebar-bg);
            color: var(--text-color);
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'Poppins', sans-serif;
        }

        .controls button:hover {
            background: var(--primary-color);
            color: var(--white);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .controls input[type="file"] {
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.9rem;
            background: var(--white);
            color: var(--text-color);
            transition: var(--transition);
            width: auto;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
        }

        .controls input[type="file"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 166, 118, 0.1);
        }

        #video, #canvas {
            width: 100%;
            max-width: 400px;
            margin: 1.5rem auto;
            border-radius: 8px;
            display: none;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
        }

        #student-data {
            margin-top: 2rem;
            padding: 1.5rem;
            border-radius: 8px;
            background: var(--white);
            border: 1px solid var(--border-color);
            max-height: 800px;
            overflow-y: auto;
            animation: fadeIn 0.5s ease;
            font-size: 0.9rem;
            line-height: 1.6;
            box-shadow: var(--shadow-sm);
        }
        
        .student-info-header {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 1rem;
        }
        
        .student-info-header h2 {
            color: var(--primary-color);
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0 0 0.5rem 0;
        }
        
        .student-info-header .school-name {
            color: var(--text-light);
            font-size: 1rem;
            margin: 0.3rem 0;
        }
        
        .profile-section {
            text-align: center;
            margin: 1.5rem 0;
        }
        
        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 8px;
            object-fit: cover;
            margin: 1rem auto;
            display: block;
            border: 2px solid var(--primary-color);
            box-shadow: var(--shadow-md);
        }
        
        .info-section {
            margin: 1.5rem 0;
        }
        
        .section-title {
            background: var(--light-bg);
            color: var(--primary-color);
            padding: 0.7rem 1rem;
            margin: 1rem 0 0.7rem 0;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.7rem;
            margin: 0.7rem 0;
        }
        
        .info-row {
            display: flex;
            margin: 0.5rem 0;
            padding: 0.5rem;
            border-bottom: 1px solid var(--border-color);
            background: var(--light-bg);
            border-radius: 4px;
        }
        
        .info-label {
            font-weight: 600;
            color: var(--primary-color);
            min-width: 150px;
            flex-shrink: 0;
        }
        
        .info-value {
            color: var(--text-color);
            flex-grow: 1;
            word-wrap: break-word;
        }
        
        #download-btn {
            display: none;
            padding: 0.8rem 1.5rem;
            margin-top: 2rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            background: var(--sidebar-bg);
            color: var(--text-color);
            transition: var(--transition);
            width: 100%;
            font-family: 'Poppins', sans-serif;
        }
        
        #download-btn:hover {
            background: var(--primary-color);
            color: var(--white);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        
        .loading {
            text-align: center;
            padding: 1.5rem;
            color: var(--primary-color);
            font-size: 1rem;
            font-weight: 500;
        }
        
        .error {
            color: #dc3545;
            background: #fef2f2;
            border: 1px solid #f5c2c7;
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
            text-align: center;
            border-left: 4px solid #dc3545;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon {
            margin-right: 0.5rem;
        }

        @media (max-width: 768px) {
            body {
                padding: 70px 10px 20px 10px;
            }

            .header {
                padding: 1rem;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .main-content {
                padding: 1.5rem;
                margin-top: 70px;
            }

            .section {
                padding: 1.2rem;
            }

            h2 {
                font-size: 1.5rem;
            }

            .controls {
                flex-direction: column;
                gap: 0.75rem;
                padding: 1.2rem;
            }

            #video, #canvas {
                max-width: 100%;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .profile-pic {
                width: 100px;
                height: 100px;
            }

            .alert-message .error,
            .alert-message .success,
            .alert-message .warning {
                font-size: 0.9rem;
            }

            .logo-img {
                width: 60px;
                height: 60px;
            }

            .back-btn {
                padding: 0.6rem 1rem;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 60px 5px 15px 5px;
            }

            .header {
                padding: 0.75rem;
                flex-direction: column;
                gap: 1rem;
            }

            .header h1 {
                font-size: 1.25rem;
            }

            .main-content {
                padding: 1rem;
                margin-top: 100px;
                border-radius: 8px;
            }

            .section {
                padding: 1rem;
            }

            h2 {
                font-size: 1.25rem;
            }

            .controls {
                padding: 1rem;
            }

            .controls button {
                padding: 0.6rem 1rem;
                font-size: 0.9rem;
            }

            .profile-pic {
                width: 80px;
                height: 80px;
            }

            .info-label {
                min-width: 120px;
            }

            .alert-message .error,
            .alert-message .success,
            .alert-message .warning {
                font-size: 0.85rem;
            }

            .logo-img {
                width: 50px;
                height: 50px;
            }

            .back-btn {
                padding: 0.5rem 0.8rem;
                font-size: 0.8rem;
            }
        }

        @media (hover: none) {
            .section:hover, .logo-img:hover, .back-btn:hover, .controls button:hover {
                transform: none;
                box-shadow: var(--shadow-sm);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
                animation: none !important;
            }

            html {
                scroll-behavior: auto;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
</head>
<body>
    <div class="header">
        <a href="/admin_page/" class="back-btn">
            <i class="fas fa-arrow-left icon"></i> Back to Main Dashboard
        </a>
        <h1><i class="fas fa-qrcode icon"></i> Scan QR Code</h1>
        <a href="/admin_page/">
            <img src="{% static 'users/images/greenlogo.png' %}" alt="Manavargal Logo" class="logo-img">
        </a>
    </div>
    <div class="container">
        <div class="main-content">
            <h2><i class="fas fa-camera icon"></i> QR Code Scanner</h2>
            <div class="controls">
                <button id="start-camera">
                    <i class="fas fa-video icon"></i> Start Camera
                </button>
                <input type="file" id="file-upload" accept="image/jpeg,image/png,application/pdf">
            </div>
            <video id="video" autoplay></video>
            <canvas id="canvas"></canvas>
            <div id="student-data"></div>
            <button id="download-btn">
                <i class="fas fa-download icon"></i> Download PDF Report
            </button>
        </div>
    </div>
    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startCameraBtn = document.getElementById('start-camera');
        const fileUpload = document.getElementById('file-upload');
        const studentDataDiv = document.getElementById('student-data');
        const downloadBtn = document.getElementById('download-btn');
        let isScanning = false;

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.worker.min.js';

        async function qr_data_retrieval(source) {
            try {
                studentDataDiv.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin icon"></i> Processing...</div>';
                downloadBtn.style.display = 'none';
                
                if (source === 'camera') {
                    if (isScanning) return;
                    isScanning = true;
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                    video.srcObject = stream;
                    video.style.display = 'block';
                    canvas.style.display = 'none';
                    
                    await new Promise(resolve => {
                        video.onloadedmetadata = () => {
                            video.play();
                            resolve();
                        };
                    });
                    
                    const scanFromVideo = () => {
                        if (!isScanning) return;
                        if (video.videoWidth === 0 || video.videoHeight === 0) {
                            requestAnimationFrame(scanFromVideo);
                            return;
                        }
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const code = jsQR(imageData.data, canvas.width, canvas.height);
                        if (code) {
                            isScanning = false;
                            video.srcObject.getTracks().forEach(track => track.stop());
                            video.style.display = 'none';
                            fetchStudentData(code.data);
                        } else {
                            requestAnimationFrame(scanFromVideo);
                        }
                    };
                    scanFromVideo();
                } else if (source === 'file') {
                    const file = fileUpload.files[0];
                    if (!file) {
                        studentDataDiv.innerHTML = '<div class="error"><i class="fas fa-exclamation-circle icon"></i> No file selected.</div>';
                        return;
                    }
                    const fileType = file.type;
                    if (fileType === 'application/pdf') {
                        const arrayBuffer = await file.arrayBuffer();
                        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                        let qrCodeFound = false;
                        for (let pageNum = 1; pageNum <= pdf.numPages && !qrCodeFound; pageNum++) {
                            const page = await pdf.getPage(pageNum);
                            const viewport = page.getViewport({ scale: 2.0 });
                            canvas.width = viewport.width;
                            canvas.height = viewport.height;
                            await page.render({
                                canvasContext: ctx,
                                viewport: viewport
                            }).promise;
                            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                            const code = jsQR(imageData.data, canvas.width, canvas.height);
                            if (code) {
                                qrCodeFound = true;
                                video.style.display = 'none';
                                canvas.style.display = 'block';
                                fetchStudentData(code.data);
                            }
                        }
                        if (!qrCodeFound) {
                            studentDataDiv.innerHTML = '<div class="error"><i class="fas fa-exclamation-circle icon"></i> No QR code found in PDF.</div>';
                            canvas.style.display = 'none';
                        }
                    } else if (fileType === 'image/jpeg' || fileType === 'image/png') {
                        const img = new Image();
                        img.onload = () => {
                            canvas.width = img.width;
                            canvas.height = img.height;
                            ctx.drawImage(img, 0, 0);
                            video.style.display = 'none';
                            canvas.style.display = 'block';
                            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                            const code = jsQR(imageData.data, canvas.width, canvas.height);
                            if (code) {
                                fetchStudentData(code.data);
                            } else {
                                studentDataDiv.innerHTML = '<div class="error"><i class="fas fa-exclamation-circle icon"></i> No QR code found in image.</div>';
                                canvas.style.display = 'none';
                            }
                        };
                        img.src = URL.createObjectURL(file);
                    } else {
                        studentDataDiv.innerHTML = '<div class="error"><i class="fas fa-exclamation-circle icon"></i> Unsupported file type. Please use JPEG, PNG, or PDF.</div>';
                    }
                }
            } catch (err) {
                isScanning = false;
                if (video.srcObject) video.srcObject.getTracks().forEach(track => track.stop());
                studentDataDiv.innerHTML = `<div class="error"><i class="fas fa-exclamation-circle icon"></i> Error: ${err.message}</div>`;
                canvas.style.display = 'none';
            }
        }

        async function fetchStudentData(url) {
            try {
                studentDataDiv.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin icon"></i> Fetching student data...</div>';
                
                const response = await fetch('/scan_qr/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({ url })
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    studentDataDiv.innerHTML = `<div class="error"><i class="fas fa-exclamation-circle icon"></i> Error ${response.status}: ${errorText}</div>`;
                    return;
                }
                
                const data = await response.json();
                if (data.error) {
                    studentDataDiv.innerHTML = `<div class="error"><i class="fas fa-exclamation-circle icon"></i> ${data.error}</div>`;
                } else {
                    displayStudentData(data);
                    downloadBtn.style.display = 'block';
                }
            } catch (err) {
                studentDataDiv.innerHTML = `<div class="error"><i class="fas fa-exclamation-circle icon"></i> Error fetching data: ${err.message}</div>`;
            }
        }

        function displayStudentData(data) {
    const formatValue = (value) => value && value !== 'None' && value !== 'N/A' ? value : 'N/A';

    studentDataDiv.innerHTML = `
        <div class="student-info-header">
            <h2><i class="fas fa-user-graduate icon"></i> Student Information</h2>
            <div class="school-name">Manavargal School Management System</div>
            <div class="school-name">Generated on: ${new Date().toLocaleDateString()}</div>
        </div>
        
        <div class="profile-section">
            ${data.profile_picture ? 
                `<img src="${data.profile_picture}" class="profile-pic" alt="Profile Picture" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                 <div style="display: none; text-align: center; color: var(--text-light); padding: 1.5rem; border: 2px dashed var(--border-color); margin: 1rem 0; border-radius: 8px;"><i class="fas fa-user icon"></i> Profile picture not available</div>` : 
                `<div style="text-align: center; color: var(--text-light); padding: 1.5rem; border: 2px dashed var(--border-color); margin: 1rem 0; border-radius: 8px;"><i class="fas fa-user icon"></i> No profile picture available</div>`
            }
        </div>
        
        <div class="info-section">
            <div class="section-title"><i class="fas fa-info-circle icon"></i> Basic Information</div>
            <div class="info-row">
                <div class="info-label"><i class="fas fa-user icon"></i> Name:</div>
                <div class="info-value">${formatValue(data.name)}</div>
            </div>
            <div class="info-row">
                <div class="info-label"><i class="fas fa-id-card icon"></i> Admission Number:</div>
                <div class="info-value">${formatValue(data.admission_number)}</div>
            </div>
            <div class="info-row">
                <div class="info-label"><i class="fas fa-graduation-cap icon"></i> Class:</div>
                <div class="info-value">${formatValue(data.class)}-${formatValue(data.section)}</div>
            </div>
            <div class="info-row">
                <div class="info-label"><i class="fas fa-hashtag icon"></i> Roll Number:</div>
                <div class="info-value">${formatValue(data.roll_number)}</div>
            </div>
            <div class="info-row">
                <div class="info-label"><i class="fas fa-code icon"></i> EMIS:</div>
                <div class="info-value">${formatValue(data.emis)}</div>
            </div>
            <div class="info-row">
                <div class="info-label"><i class="fas fa-envelope icon"></i> Email:</div>
                <div class="info-value">${formatValue(data.email)}</div>
            </div>
        </div>

        <div class="info-section">
            <div class="section-title"><i class="fas fa-user icon"></i> Personal Details</div>
            <div class="info-row">
                <div class="info-label"><i class="fas fa-venus-mars icon"></i> Gender:</div>
                <div class="info-value">${formatValue(data.gender)}</div>
            </div>
            <div class="info-row">
                <div class="info-label"><i class="fas fa-birthday-cake icon"></i> Date of Birth:</div>
                <div class="info-value">${formatValue(data.dob)}</div>
            </div>
            <div class="info-row">
                <div class="info-label"><i class="fas fa-font icon"></i> Tamil Name:</div>
                <div class="info-value">${formatValue(data.tamil_name)}</div>
            </div>
            <div class="info-row">
                <div class="info-label"><i class="fas fa-flag icon"></i> Nationality:</div>
                <div class="info-value">${formatValue(data.nationality)}</div>
            </div>
            <div class="info-row">
                <div class="info-label"><i class="fas fa-tint icon"></i> Blood Group:</div>
                <div class="info-value">${formatValue(data.blood_group)}</div>
            </div>
            <div class="info-row">
                <div class="info-label"><i class="fas fa-language icon"></i> Mother Tongue:</div>
                <div class="info-value">${formatValue(data.mother_tongue)}</div>

        downloadBtn.addEventListener('click', async () => {
            try {
                downloadBtn.innerHTML = '<i class="fas fa-spinner fa-spin icon"></i> Generating PDF...';
                downloadBtn.disabled = true;
                
                const response = await fetch('/download_student_pdf/', {
                    method: 'GET',
                    headers: {
                        'X-CSRFToken': getCookie('csrftoken')
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                
                // Get filename from response headers or use default
                const contentDisposition = response.headers.get('Content-Disposition');
                let filename = 'student_details.pdf';
                if (contentDisposition) {
                    const filenameMatch = contentDisposition.match(/filename="(.+)"/);
                    if (filenameMatch) {
                        filename = filenameMatch[1];
                    }
                }
                
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
            } catch (error) {
                console.error('PDF download error:', error);
                alert('Error downloading PDF. Please try again.');
            } finally {
                downloadBtn.innerHTML = '<i class="fas fa-download icon"></i> Download PDF Report';
                downloadBtn.disabled = false;
            }
        });

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
