{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manavargal School Management System - {{ title }}</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            font-weight: 400;
            background: var(--white);
            min-height: 100vh;
            color: var(--text-color);
            padding: 120px 20px 40px 20px;
        }

        h1, h2, h3 {
            font-family: 'Montserrat', sans-serif;
            text-align: center;
        }

        :root {
            --primary-color: #00a676;
            --primary-hover: #00b88d;
            --danger-color: #dc2626;
            --danger-hover: #ef4444;
            --sidebar-bg: #f0f9f4;
            --sidebar-border: #a8d5c2;
            --white: #ffffff;
            --light-bg: #f8f9fa;
            --border-color: #adb5bd;
            --text-color: #495057;
            --text-light: #868e96;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --border-radius: 16px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            overflow-x: hidden;
        }

        .header {
            background: var(--white);
            color: var(--text-color);
            padding: 0.5rem 1rem 0.5rem 0.5rem;
            border: 2px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 0;
            gap: 0.5rem;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            flex-grow: 1;
            color: var(--primary-color);
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            flex: none;
            margin: 0;
            z-index: 0;
        }

        .back-btn {
            padding: 0.8rem 1.5rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            background: var(--sidebar-bg);
            color: var(--text-color);
            text-decoration: none;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
            z-index: 1;
        }

        .back-btn:hover {
            background: var(--primary-color);
            color: var(--white);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .logo-container {
            width: 100px;
            height: 80px;
            background: var(--white);
            border-radius: var(--border-radius);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            border: 2px solid var(--sidebar-border);
            position: relative;
            z-index: 1;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: var(--transition);
        }

        .logo-container:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-md);
        }

        .logo-container:hover img {
            transform: scale(1.05);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .messages {
            margin-bottom: 1.5rem;
        }

        .messages .success {
            background: #d4edda;
            color: var(--primary-color);
            padding: 0.75rem;
            border-radius: 8px;
            border-left: 4px solid var(--primary-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 2px solid var(--border-color);
        }

        .messages .error {
            background: #fef2f2;
            color: #dc3545;
            padding: 0.75rem;
            border-radius: 8px;
            border-left: 4px solid #dc3545;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 2px solid var(--border-color);
        }

        .back-buttons {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .back-student-btn, .back-dashboard-btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            background: var(--light-bg);
            color: var(--text-color);
            text-decoration: none;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 2px solid var(--border-color);
        }

        .back-student-btn:hover, .back-dashboard-btn:hover {
            background: var(--primary-color);
            color: var(--white);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .section {
            background: var(--light-bg);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            margin-bottom: 2rem;
            transition: var(--transition);
        }

        .section:hover {
            box-shadow: var(--shadow-md);
        }

        .subheading {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .subheading h3 {
            color: var(--primary-color);
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
        }

        .form-group.required label:after {
            content: " *";
            color: #dc2626;
        }

        label {
            display: block;
            color: var(--primary-color);
            font-size: 0.9rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.7rem;
            border: 2px solid var(--border-color);
            background: var(--white);
            border-radius: 8px;
            font-size: 0.9rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(0, 166, 118, 0.3);
        }

        textarea {
            resize: vertical;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        button {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .save-btn {
            background: var(--primary-color);
            color: var(--white);
            border: 2px solid var(--primary-color);
        }

        .save-btn:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .cancel-btn {
            background: var(--light-bg);
            color: var(--text-color);
            border: 2px solid var(--border-color);
        }

        .cancel-btn:hover {
            background: var(--primary-color);
            color: var(--white);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .icon {
            margin-right: 0.5rem;
        }

        .scroll-top-btn {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background: var(--primary-color);
            color: var(--white);
            padding: 1rem;
            border-radius: 50px;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            width: 50px;
            height: 50px;
            border: none;
            cursor: pointer;
        }

        .scroll-top-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .scroll-top-btn.show {
            display: flex;
        }

        @media (max-width: 768px) {
            body {
                padding: 100px 10px 20px 10px;
            }

            .header {
                padding: 1rem;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .logo-container {
                width: 80px;
                height: 64px;
            }

            .back-buttons {
                flex-direction: column;
                gap: 0.75rem;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .form-actions {
                flex-direction: column;
            }

            .section {
                padding: 1.2rem;
            }

            .messages .success, .messages .error {
                font-size: 0.85rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 80px 5px 15px 5px;
            }

            .header {
                padding: 0.75rem;
                flex-direction: column;
                gap: 1rem;
            }

            .header h1 {
                font-size: 1.25rem;
            }

            .logo-container {
                width: 60px;
                height: 48px;
            }

            .back-buttons {
                gap: 0.75rem;
            }

            .section {
                padding: 1rem;
            }

            .messages .success, .messages .error {
                font-size: 0.8rem;
            }

            .back-student-btn, .back-dashboard-btn {
                padding: 0.5rem 0.8rem;
                font-size: 0.8rem;
            }

            .save-btn, .cancel-btn {
                padding: 0.6rem 0.8rem;
                font-size: 0.9rem;
            }

            .scroll-top-btn {
                bottom: 0.75rem;
                right: 0.75rem;
                width: 40px;
                height: 40px;
                font-size: 1rem;
                padding: 0.8rem;
            }
        }

        @media (hover: none) {
            .section:hover, .logo-container:hover, .back-btn:hover, .back-student-btn:hover, .back-dashboard-btn:hover, .save-btn:hover, .cancel-btn:hover, .scroll-top-btn:hover {
                transform: none;
                box-shadow: var(--shadow-sm);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
                animation: none !important;
            }

            html {
                scroll-behavior: auto;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="{% url 'admin_page' %}" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back To Main Dashboard
        </a>
        <h1>{{ title }}</h1>
        <a href="{% url 'admin_page' %}">
            <div class="logo-container">
                <img src="{% static 'users/images/adminlogo.jpg' %}" alt="School Logo">
            </div>
        </a>
    </div>

    <div class="container">
        <div class="back-buttons">
            <button class="back-student-btn cancel-btn" onclick="window.location.href='{% url 'student_info' %}'">
                <i class="fas fa-arrow-left"></i> Back to Student Info
            </button>
        </div>

        <div class="messages">
            {% if messages %}
                {% for message in messages %}
                    <div class="{% if message.tags == 'success' %}success{% else %}error{% endif %}">
                        <i class="fas {% if message.tags == 'success' %}fa-check-circle{% else %}fa-exclamation-circle{% endif %} icon"></i>
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        </div>

        <form method="POST">
            {% csrf_token %}
            <div class="section">
                <div class="subheading">
                    <h3><i class="fas fa-user"></i> Basic Information</h3>
                </div>
                <div class="grid">
                    <div class="form-group required">
                        <label>Full Name</label>
                        <input type="text" name="name" value="{{ name|default:'' }}" required>
                    </div>
                    <div class="form-group required">
                        <label>Admission Number</label>
                        <input type="text" name="admission_number" value="{{ admission_number|default:'' }}" required>
                    </div>
                    <div class="form-group required">
                        <label>Class-Section (e.g., 2-A)</label>
                        <input type="text" name="class_section" value="{{ class_section|default:'' }}" required>
                    </div>
                    <div class="form-group required">
                        <label>Roll Number</label>
                        <input type="text" name="roll_number" value="{{ roll_number|default:'' }}" required>
                    </div>
                    <div class="form-group required">
                        <label>EMIS Number</label>
                        <input type="text" name="emis" value="{{ emis|default:'' }}" required>
                    </div>
                    <div class="form-group required">
                        <label>Email</label>
                        <input type="email" name="email" value="{{ email|default:'' }}" required>
                    </div>
                </div>
            </div>
            <div class="section">
                <div class="subheading">
                    <h3><i class="fas fa-info-circle"></i> Personal Details</h3>
                </div>
                <div class="grid">
                    <div class="form-group">
                        <label>Gender</label>
                        <select name="gender">
                            <option value="">Select Gender</option>
                            {% for option in gender_options %}
                                <option value="{{ option }}" {% if gender == option %}selected{% endif %}>{{ option }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Community</label>
                        <select name="community">
                            <option value="">Select Community</option>
                            {% for option in community_options %}
                                <option value="{{ option }}" {% if community == option %}selected{% endif %}>{{ option }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Tamil Name</label>
                        <input type="text" name="tamil_name" value="{{ tamil_name|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input type="date" name="dob" value="{{ dob|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Nationality</label>
                        <input type="text" name="nationality" value="{{ nationality|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Blood Group</label>
                        <select name="blood_group">
                            <option value="">Select Blood Group</option>
                            {% for option in blood_group_options %}
                                <option value="{{ option }}" {% if blood_group == option %}selected{% endif %}>{{ option }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Mother Tongue</label>
                        <input type="text" name="mother_tongue" value="{{ mother_tongue|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Caste</label>
                        <input type="text" name="caste" value="{{ caste|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Religion</label>
                        <input type="text" name="religion" value="{{ religion|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Place of Birth</label>
                        <input type="text" name="place_of_birth" value="{{ place_of_birth|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Aadhaar Number</label>
                        <input type="text" name="aadhaar" value="{{ aadhaar|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Disability</label>
                        <input type="text" name="disability" value="{{ disability|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Identification Mark 1</label>
                        <input type="text" name="id_mark1" value="{{ id_mark1|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Identification Mark 2</label>
                        <input type="text" name="id_mark2" value="{{ id_mark2|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Admission Class</label>
                        <input type="text" name="admission_class" value="{{ admission_class|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Admission Year</label>
                        <input type="text" name="admission_year" value="{{ admission_year|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Admission Date</label>
                        <input type="date" name="admission_date" value="{{ admission_date|default:'' }}">
                    </div>
                </div>
            </div>
            <div class="section">
                <div class="subheading">
                    <h3><i class="fas fa-address-book"></i> Contact Information</h3>
                </div>
                <div class="grid">
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Address</label>
                        <textarea name="address" rows="4">{{ address|default:'' }}</textarea>
                    </div>
                    <div class="form-group">
                        <label>Contact Number</label>
                        <input type="text" name="contact" value="{{ contact|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Alternate Contact</label>
                        <input type="text" name="alt_contact" value="{{ alt_contact|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Country</label>
                        <input type="text" name="country" value="{{ country|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>State</label>
                        <input type="text" name="state" value="{{ state|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>City</label>
                        <input type="text" name="city" value="{{ city|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Pincode</label>
                        <input type="text" name="pincode" value="{{ pincode|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <input type="text" name="status" value="{{ status|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>House</label>
                        <input type="text" name="house" value="{{ house|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Teacher Ward</label>
                        <select name="teacher_ward">
                            <option value="">Select Option</option>
                            {% for option in teacher_ward_options %}
                                <option value="{{ option }}" {% if teacher_ward == option %}selected{% endif %}>{{ option|capfirst }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>RTE</label>
                        <select name="rte">
                            <option value="">Select Option</option>
                            {% for option in rte_options %}
                                <option value="{{ option }}" {% if rte == option %}selected{% endif %}>{{ option|capfirst }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Sports Quota</label>
                        <select name="sports_quota">
                            <option value="">Select Option</option>
                            {% for option in sports_quota_options %}
                                <option value="{{ option }}" {% if sports_quota == option %}selected{% endif %}>{{ option|capfirst }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Previous School</label>
                        <input type="text" name="prev_school" value="{{ prev_school|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Previous Board</label>
                        <input type="text" name="prev_board" value="{{ prev_board|default:'' }}">
                    </div>
                </div>
            </div>
            <div class="section">
                <div class="subheading">
                    <h3><i class="fas fa-users"></i> Family Information</h3>
                </div>
                <div class="grid">
                    <div class="form-group">
                        <label>Father's Name</label>
                        <input type="text" name="father_name" value="{{ father_name|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Father's Name (Tamil)</label>
                        <input type="text" name="father_name_tamil" value="{{ father_name_tamil|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Mother's Name</label>
                        <input type="text" name="mother_name" value="{{ mother_name|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Mother's Name (Tamil)</label>
                        <input type="text" name="mother_name_tamil" value="{{ mother_name_tamil|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Father's Contact</label>
                        <input type="text" name="father_contact" value="{{ father_contact|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Mother's Contact</label>
                        <input type="text" name="mother_contact" value="{{ mother_contact|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Father's Email</label>
                        <input type="email" name="father_email" value="{{ father_email|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Mother's Email</label>
                        <input type="email" name="mother_email" value="{{ mother_email|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Father's Qualification</label>
                        <input type="text" name="father_qualification" value="{{ father_qualification|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Mother's Qualification</label>
                        <input type="text" name="mother_qualification" value="{{ mother_qualification|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Father's Occupation</label>
                        <input type="text" name="father_occupation" value="{{ father_occupation|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Mother's Occupation</label>
                        <input type="text" name="mother_occupation" value="{{ mother_occupation|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Father's Income</label>
                        <input type="text" name="father_income" value="{{ father_income|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Mother's Income</label>
                        <input type="text" name="mother_income" value="{{ mother_income|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Guardian's Name</label>
                        <input type="text" name="guardian_name" value="{{ guardian_name|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Guardian's Contact</label>
                        <input type="text" name="guardian_contact" value="{{ guardian_contact|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Guardian's Email</label>
                        <input type="email" name="guardian_email" value="{{ guardian_email|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Child Living With</label>
                        <input type="text" name="child_living" value="{{ child_living|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Rights on Child</label>
                        <input type="text" name="rights_on_child" value="{{ rights_on_child|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Medical Blood Group</label>
                        <select name="med_blood_group">
                            <option value="">Select Blood Group</option>
                            {% for option in blood_group_options %}
                                <option value="{{ option }}" {% if med_blood_group == option %}selected{% endif %}>{{ option }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Diseases</label>
                        <textarea name="diseases" rows="4">{{ diseases|default:'' }}</textarea>
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Allergies</label>
                        <textarea name="allergies" rows="4">{{ allergies|default:'' }}</textarea>
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Medicines</label>
                        <textarea name="medicines" rows="4">{{ medicines|default:'' }}</textarea>
                    </div>
                    <div class="form-group">
                        <label>Hospital</label>
                        <input type="text" name="hospital" value="{{ hospital|default:'' }}">
                    </div>
                    <div class="form-group">
                        <label>Doctor</label>
                        <input type="text" name="doctor" value="{{ doctor|default:'' }}">
                    </div>
                </div>
            </div>
            <div class="form-actions">
                <button type="button" class="cancel-btn" onclick="window.location.href='{% url 'student_info' %}'">
                    <i class="fas fa-times"></i> Cancel
                </button>
                <button type="submit" class="save-btn">
                    <i class="fas fa-save"></i> Save Student
                </button>
            </div>
        </form>
    </div>

    <button class="scroll-top-btn" onclick="scrollToTop()">
        <i class="fas fa-chevron-up"></i>
    </button>

    <script>
        window.onscroll = function() {
            const btn = document.querySelector('.scroll-top-btn');
            if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
                btn.classList.add('show');
            } else {
                btn.classList.remove('show');
            }
        };

        function scrollToTop() {
            document.body.scrollTop = 0;
            document.documentElement.scrollTop = 0;
        }

        document.addEventListener('DOMContentLoaded', function() {
            {% for field, value in request.POST.items %}
                {% if value %}
                    const field = document.querySelector('[name="{{ field }}"]');
                    if (field && field.tagName === 'SELECT') {
                        field.value = '{{ value }}';
                    }
                {% endif %}
            {% endfor %}
        });
    </script>
</body>
</html>
