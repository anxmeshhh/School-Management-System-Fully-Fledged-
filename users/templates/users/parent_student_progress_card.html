{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Student Progress Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            font-weight: 400;
            background: var(--white);
            min-height: 100vh;
            color: var(--text-color);
            padding: 80px 20px 40px 20px;
        }

        h1, h2, h3 {
            font-family: 'Montserrat', sans-serif;
        }

        :root {
            --primary-color: #00a676;
            --primary-hover: #00b88d;
            --sidebar-bg: #f0f9f4;
            --sidebar-border: #d1e7dd;
            --white: #ffffff;
            --light-bg: #f8f9fa;
            --border-color: #e9ecef;
            --text-color: #495057;
            --text-light: #868e96;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --border-radius: 16px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            overflow-x: hidden;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            background: var(--white);
            color: var(--text-color);
            padding: 1.5rem 2rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: var(--border-radius) var(--border-radius) 0 0;
        }

        .header .logo-button {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            flex-grow: 1;
            color: var(--primary-color);
        }

        .logo-img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .logo-img:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-md);
        }

        .back-btn {
            padding: 0.8rem 1.5rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            background: var(--sidebar-bg);
            color: var(--text-color);
            text-decoration: none;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-btn:hover {
            background: var(--primary-color);
            color: var(--white);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .main-content {
            background: var(--white);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-sm);
            padding: 2rem;
            margin-top: 80px;
        }

        .student-info {
            text-align: center;
            color: var(--text-color);
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
        }

        .progress-card-message {
            background: var(--light-bg);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 2rem;
            text-align: center;
            color: var(--primary-color);
            font-size: 1.5rem;
            font-weight: 600;
            transition: var(--transition);
        }

        .progress-card-message:hover {
            box-shadow: var(--shadow-md);
        }

        @media (max-width: 768px) {
            body {
                padding: 70px 10px 20px 10px;
            }

            .header {
                padding: 1rem;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .main-content {
                padding: 1.5rem;
                margin-top: 70px;
            }

            .student-info {
                font-size: 1rem;
            }

            .progress-card-message {
                font-size: 1.25rem;
                padding: 1.2rem;
            }

            .logo-img {
                width: 40px;
                height: 40px;
            }

            .back-btn {
                padding: 0.6rem 1rem;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 60px 5px 15px 5px;
            }

            .header {
                padding: 0.75rem;
                flex-direction: column;
                gap: 1rem;
            }

            .header h1 {
                font-size: 1.25rem;
            }

            .main-content {
                padding: 1rem;
                margin-top: 100px;
                border-radius: 8px;
            }

            .student-info {
                font-size: 0.9rem;
            }

            .progress-card-message {
                font-size: 1.1rem;
                padding: 1rem;
            }

            .logo-img {
                width: 35px;
                height: 35px;
            }

            .back-btn {
                padding: 0.5rem 0.8rem;
                font-size: 0.8rem;
            }
        }

        @media (hover: none) {
            .progress-card-message:hover, .logo-img:hover, .back-btn:hover {
                transform: none;
                box-shadow: var(--shadow-sm);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
                animation: none !important;
            }

            html {
                scroll-behavior: auto;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="{% url 'parent_dashboard' %}" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back to Main Dashboard
        </a>
        <h1>Student Progress Card</h1>
        <div class="logo-button">
            <img src="{% static 'users/images/greenlogo.png' %}" alt="School Logo" class="logo-img">
        </div>
    </div>
    <div class="container">
        <div class="main-content">
            <div class="student-info">
                <p>Class: {{ class_name }}</p>
                <p>Section: {{ section|default:"N/A" }}</p>
            </div>
            <div class="progress-card-message">
                The results will be announced soon.
            </div>
        </div>
    </div>
</body>
</html>
