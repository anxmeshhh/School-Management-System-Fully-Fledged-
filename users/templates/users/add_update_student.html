{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manavargal School Management System - {{ title }}</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            font-weight: 400;
            background: var(--white);
            min-height: 100vh;
            color: var(--text-color);
            padding: 80px 20px 40px 20px;
        }

        h1, h2, h3 {
            font-family: 'Montserrat', sans-serif;
        }

        :root {
            --primary-color: #00a676;
            --primary-hover: #00b88d;
            --sidebar-bg: #f0f9f4;
            --sidebar-border: #d1e7dd;
            --white: #ffffff;
            --light-bg: #f8f9fa;
            --border-color: #e9ecef;
            --text-color: #495057;
            --text-light: #868e96;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --border-radius: 16px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --dull-highlighter: #d4edda;
        }

        html {
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            overflow-x: hidden;
        }

        .header {
            background: var(--white);
            color: var(--text-color);
            padding: 0.5rem 1rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: var(--border-radius) var(--border-radius) 0 0;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            flex-grow: 1;
            color: var(--primary-color);
        }

        .back-btn {
            padding: 0.8rem 1.5rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            background: var(--sidebar-bg);
            color: var(--text-color);
            text-decoration: none;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-btn:hover {
            background: var(--primary-color);
            color: var(--white);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .logo-img {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            object-fit: cover;
            border: none;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .logo-img:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-md);
        }

        .container {
            background: var(--white);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-sm);
            padding: 2rem;
            margin-top: 80px;
            transition: var(--transition);
        }

        .container:hover {
            box-shadow: var(--shadow-md);
        }

        .messages p {
            text-align: center;
            margin: 1rem 0;
            font-size: 0.9rem;
            color: #dc2626;
            background: rgba(255, 75, 75, 0.1);
            padding: 0.6rem;
            border-radius: 6px;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-section h2 {
            color: var(--primary-color);
            font-size: 1.8rem;
            font-weight: 600;
            margin: 0;
        }

        .back-buttons {
            display: flex;
            gap: 1rem;
        }

        .back-student-btn, .back-dashboard-btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            background: var(--light-bg);
            color: var(--text-color);
            text-decoration: none;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid var(--border-color);
        }

        .back-student-btn:hover, .back-dashboard-btn:hover {
            background: var(--primary-color);
            color: var(--white);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .section {
            background: var(--light-bg);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            margin-bottom: 2rem;
            transition: var(--transition);
        }

        .section:hover {
            box-shadow: var(--shadow-md);
        }

        .subheading {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .subheading h3 {
            color: var(--primary-color);
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
        }

        .required label:after {
            content: " *";
            color: #dc2626;
        }

        label {
            display: block;
            color: var(--primary-color);
            font-size: 0.9rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.7rem;
            border: 2px solid var(--border-color);
            background: var(--white);
            border-radius: 8px;
            font-size: 0.9rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(0, 166, 118, 0.3);
        }

        textarea {
            resize: vertical;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        button {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .save-btn {
            background: var(--primary-color);
            color: var(--white);
            border: 2px solid var(--primary-color);
        }

        .save-btn:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .cancel-btn {
            background: var(--light-bg);
            color: var(--text-color);
            border: 2px solid var(--border-color);
        }

        .cancel-btn:hover {
            background: var(--primary-color);
            color: var(--white);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        @media (max-width: 768px) {
            body {
                padding: 70px 10px 20px 10px;
            }

            .header {
                padding: 1rem;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .container {
                padding: 1.5rem;
                margin-top: 70px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .back-buttons {
                flex-direction: column;
                gap: 0.75rem;
            }

            .form-actions {
                flex-direction: column;
            }

            .messages p {
                font-size: 0.85rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 60px 5px 15px 5px;
            }

            .header {
                padding: 0.75rem;
                flex-direction: column;
                gap: 1rem;
            }

            .header h1 {
                font-size: 1.25rem;
            }

            .container {
                padding: 1rem;
                margin-top: 100px;
                border-radius: 8px;
            }

            .section {
                padding: 1rem;
            }

            .messages p {
                font-size: 0.8rem;
            }
        }

        @media (hover: none) {
            .section:hover, .logo-img:hover, .back-btn:hover, .card:hover {
                transform: none;
                box-shadow: var(--shadow-sm);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
                animation: none !important;
            }

            html {
                scroll-behavior: auto;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="{% url 'student_info' %}" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back To Main Dashboard
        </a>
        <h1>{{ title }}</h1>
        <a href="{% url 'student_info' %}">
            <img src="{% static 'users/images/adminlogo.jpg' %}" alt="School Logo" class="logo-img">
        </a>
    </div>

    <div class="container">
        <div class="back-buttons">
            <button class="cancel-btn" onclick="window.location.href='{% url 'student_info' %}'">
                <i class="fas fa-arrow-left"></i> Back to Student Info
            </button>
            
        </div>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p class="{{ message.tags }}">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST" onsubmit="return confirm('Are you sure you want to update this student\'s information?');">
            {% csrf_token %}
            <input type="hidden" name="user_id" value="{{ user_id }}">

            <!-- Basic Information Section -->
            <div class="section">
                <div class="subheading">
                    <h3><i class="fas fa-user"></i> Basic Information</h3>
                </div>
                <div class="grid">
                    <div class="form-group required">
                        <label><i class="fas fa-user"></i> Full Name</label>
                        <input type="text" name="name" value="{{ post_data.name|default:name|default_if_none:'' }}" required>
                    </div>
                    <div class="form-group required">
                        <label><i class="fas fa-id-card"></i> Admission Number</label>
                        <input type="text" name="admission_number" value="{{ post_data.admission_number|default:admission_number|default_if_none:'' }}" required>
                    </div>
                    <div class="form-group required">
                        <label><i class="fas fa-chalkboard"></i> Class-Section (e.g., 2-A)</label>
                        <input type="text" name="class_section" value="{{ post_data.class_section|default:class_section|default_if_none:'' }}" required>
                    </div>
                    <div class="form-group required">
                        <label><i class="fas fa-hashtag"></i> Roll Number</label>
                        <input type="text" name="roll_number" value="{{ post_data.roll_number|default:roll_number|default_if_none:'' }}" required>
                    </div>
                    <div class="form-group required">
                        <label><i class="fas fa-fingerprint"></i> EMIS Number</label>
                        <input type="text" name="emis" value="{{ post_data.emis|default:emis|default_if_none:'' }}" required>
                    </div>
                    <div class="form-group required">
                        <label><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" name="email" value="{{ post_data.email|default:email|default_if_none:'' }}" required>
                    </div>
                </div>
            </div>

            <!-- Personal Information Section -->
            <div class="section">
                <div class="subheading">
                    <h3><i class="fas fa-info-circle"></i> Personal Information</h3>
                </div>
                <div class="grid">
                    <div class="form-group">
                        <label><i class="fas fa-venus-mars"></i> Gender</label>
                        <select name="gender">
                            <option value="" {% if not post_data.gender|default:gender %}selected{% endif %}>Select Gender</option>
                            {% for option in gender_options %}
                                <option value="{{ option }}" {% if post_data.gender|default:gender == option %}selected{% endif %}>{{ option }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-users"></i> Community</label>
                        <select name="community">
                            <option value="" {% if not post_data.community|default:community %}selected{% endif %}>Select Community</option>
                            {% for option in community_options %}
                                <option value="{{ option }}" {% if post_data.community|default:community == option %}selected{% endif %}>{{ option }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-font"></i> Tamil Name</label>
                        <input type="text" name="tamil_name" value="{{ post_data.tamil_name|default:tamil_name|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-birthday-cake"></i> Date of Birth</label>
                        <input type="date" name="dob" value="{{ post_data.dob|default:dob|date:'Y-m-d'|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-globe"></i> Nationality</label>
                        <input type="text" name="nationality" value="{{ post_data.nationality|default:nationality|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-tint"></i> Blood Group</label>
                        <select name="blood_group">
                            <option value="" {% if not post_data.blood_group|default:blood_group %}selected{% endif %}>Select Blood Group</option>
                            {% for option in blood_group_options %}
                                <option value="{{ option }}" {% if post_data.blood_group|default:blood_group == option %}selected{% endif %}>{{ option }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-language"></i> Mother Tongue</label>
                        <input type="text" name="mother_tongue" value="{{ post_data.mother_tongue|default:mother_tongue|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-user-tag"></i> Caste</label>
                        <input type="text" name="caste" value="{{ post_data.caste|default:caste|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-prayer-rug"></i> Religion</label>
                        <input type="text" name="religion" value="{{ post_data.religion|default:religion|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-map-marker-alt"></i> Place of Birth</label>
                        <input type="text" name="place_of_birth" value="{{ post_data.place_of_birth|default:place_of_birth|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-id-card-alt"></i> Aadhaar Number</label>
                        <input type="text" name="aadhaar" value="{{ post_data.aadhaar|default:aadhaar|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-wheelchair"></i> Disability</label>
                        <input type="text" name="disability" value="{{ post_data.disability|default:disability|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-eye"></i> Identification Mark 1</label>
                        <input type="text" name="id_mark1" value="{{ post_data.id_mark1|default:id_mark1|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-eye-slash"></i> Identification Mark 2</label>
                        <input type="text" name="id_mark2" value="{{ post_data.id_mark2|default:id_mark2|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-graduation-cap"></i> Admission Class</label>
                        <input type="text" name="admission_class" value="{{ post_data.admission_class|default:admission_class|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-calendar"></i> Admission Year</label>
                        <input type="text" name="admission_year" value="{{ post_data.admission_year|default:admission_year|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-calendar-check"></i> Admission Date</label>
                        <input type="date" name="admission_date" value="{{ post_data.admission_date|default:admission_date|date:'Y-m-d'|default_if_none:'' }}">
                    </div>
                </div>
            </div>

            <!-- Contact Information Section -->
            <div class="section">
                <div class="subheading">
                    <h3><i class="fas fa-address-book"></i> Contact Information</h3>
                </div>
                <div class="grid">
                    <div class="form-group" style="grid-column: span 2;">
                        <label><i class="fas fa-map-marked-alt"></i> Address</label>
                        <textarea name="address" rows="4">{{ post_data.address|default:address|default_if_none:'' }}</textarea>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-phone"></i> Contact Number</label>
                        <input type="text" name="contact" value="{{ post_data.contact|default:contact|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-phone-alt"></i> Alternate Contact</label>
                        <input type="text" name="alt_contact" value="{{ post_data.alt_contact|default:alt_contact|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-globe-americas"></i> Country</label>
                        <input type="text" name="country" value="{{ post_data.country|default:country|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-map"></i> State</label>
                        <input type="text" name="state" value="{{ post_data.state|default:state|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-city"></i> City</label>
                        <input type="text" name="city" value="{{ post_data.city|default:city|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-map-pin"></i> Pincode</label>
                        <input type="text" name="pincode" value="{{ post_data.pincode|default:pincode|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-user-check"></i> Status</label>
                        <input type="text" name="status" value="{{ post_data.status|default:status|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-home"></i> House</label>
                        <input type="text" name="house" value="{{ post_data.house|default:house|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-user-tie"></i> Teacher Ward</label>
                        <select name="teacher_ward">
                            <option value="" {% if not post_data.teacher_ward|default:teacher_ward %}selected{% endif %}>Select Option</option>
                            {% for option in teacher_ward_options %}
                                <option value="{{ option }}" {% if post_data.teacher_ward|default:teacher_ward == option %}selected{% endif %}>{{ option|title }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-school"></i> RTE</label>
                        <select name="rte">
                            <option value="" {% if not post_data.rte|default:rte %}selected{% endif %}>Select Option</option>
                            {% for option in rte_options %}
                                <option value="{{ option }}" {% if post_data.rte|default:rte == option %}selected{% endif %}>{{ option|title }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-running"></i> Sports Quota</label>
                        <select name="sports_quota">
                            <option value="" {% if not post_data.sports_quota|default:sports_quota %}selected{% endif %}>Select Option</option>
                            {% for option in sports_quota_options %}
                                <option value="{{ option }}" {% if post_data.sports_quota|default:sports_quota == option %}selected{% endif %}>{{ option|title }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-school"></i> Previous School</label>
                        <input type="text" name="prev_school" value="{{ post_data.prev_school|default:prev_school|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-certificate"></i> Previous Board</label>
                        <input type="text" name="prev_board" value="{{ post_data.prev_board|default:prev_board|default_if_none:'' }}">
                    </div>
                </div>
            </div>

            <!-- Family Information Section -->
            <div class="section">
                <div class="subheading">
                    <h3><i class="fas fa-users"></i> Family Information</h3>
                </div>
                <div class="grid">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Father's Name</label>
                        <input type="text" name="father_name" value="{{ post_data.father_name|default:father_name|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-font"></i> Father's Name (Tamil)</label>
                        <input type="text" name="father_name_tamil" value="{{ post_data.father_name_tamil|default:father_name_tamil|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-user-friends"></i> Mother's Name</label>
                        <input type="text" name="mother_name" value="{{ post_data.mother_name|default:mother_name|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-font"></i> Mother's Name (Tamil)</label>
                        <input type="text" name="mother_name_tamil" value="{{ post_data.mother_name_tamil|default:mother_name_tamil|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-phone"></i> Father's Contact</label>
                        <input type="text" name="father_contact" value="{{ post_data.father_contact|default:father_contact|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-phone-alt"></i> Mother's Contact</label>
                        <input type="text" name="mother_contact" value="{{ post_data.mother_contact|default:mother_contact|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> Father's Email</label>
                        <input type="email" name="father_email" value="{{ post_data.father_email|default:father_email|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> Mother's Email</label>
                        <input type="email" name="mother_email" value="{{ post_data.mother_email|default:mother_email|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-graduation-cap"></i> Father's Qualification</label>
                        <input type="text" name="father_qualification" value="{{ post_data.father_qualification|default:father_qualification|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-graduation-cap"></i> Mother's Qualification</label>
                        <input type="text" name="mother_qualification" value="{{ post_data.mother_qualification|default:mother_qualification|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-briefcase"></i> Father's Occupation</label>
                        <input type="text" name="father_occupation" value="{{ post_data.father_occupation|default:father_occupation|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-briefcase"></i> Mother's Occupation</label>
                        <input type="text" name="mother_occupation" value="{{ post_data.mother_occupation|default:mother_occupation|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-rupee-sign"></i> Father's Income</label>
                        <input type="text" name="father_income" value="{{ post_data.father_income|default:father_income|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-rupee-sign"></i> Mother's Income</label>
                        <input type="text" name="mother_income" value="{{ post_data.mother_income|default:mother_income|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-user-shield"></i> Guardian's Name</label>
                        <input type="text" name="guardian_name" value="{{ post_data.guardian_name|default:guardian_name|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-phone"></i> Guardian's Contact</label>
                        <input type="text" name="guardian_contact" value="{{ post_data.guardian_contact|default:guardian_contact|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> Guardian's Email</label>
                        <input type="email" name="guardian_email" value="{{ post_data.guardian_email|default:guardian_email|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-home"></i> Child Living With</label>
                        <input type="text" name="child_living" value="{{ post_data.child_living|default:child_living|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-balance-scale"></i> Rights on Child</label>
                        <input type="text" name="rights_on_child" value="{{ post_data.rights_on_child|default:rights_on_child|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-tint"></i> Medical Blood Group</label>
                        <select name="med_blood_group">
                            <option value="" {% if not post_data.med_blood_group|default:med_blood_group %}selected{% endif %}>Select Blood Group</option>
                            {% for option in blood_group_options %}
                                <option value="{{ option }}" {% if post_data.med_blood_group|default:med_blood_group == option %}selected{% endif %}>{{ option }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label><i class="fas fa-biohazard"></i> Diseases</label>
                        <textarea name="diseases" rows="4">{{ post_data.diseases|default:diseases|default_if_none:'' }}</textarea>
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label><i class="fas fa-allergies"></i> Allergies</label>
                        <textarea name="allergies" rows="4">{{ post_data.allergies|default:allergies|default_if_none:'' }}</textarea>
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label><i class="fas fa-pills"></i> Medicines</label>
                        <textarea name="medicines" rows="4">{{ post_data.medicines|default:medicines|default_if_none:'' }}</textarea>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-hospital"></i> Hospital</label>
                        <input type="text" name="hospital" value="{{ post_data.hospital|default:hospital|default_if_none:'' }}">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-user-md"></i> Doctor</label>
                        <input type="text" name="doctor" value="{{ post_data.doctor|default:doctor|default_if_none:'' }}">
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="cancel-btn" onclick="window.location.href='{% url 'student_info' %}'">
                    <i class="fas fa-times"></i> Cancel
                </button>
                <button type="submit" class="save-btn">
                    <i class="fas fa-save"></i> Update Student
                </button>
            </div>
        </form>
    </div>

</body>
</html>
