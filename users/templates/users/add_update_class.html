{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manavargal School Management System - {{ title }}</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            font-weight: 400;
            background: var(--white);
            min-height: 100vh;
            color: var(--text-color);
            padding: 120px 20px 40px 20px;
        }
        h1, h2, h3 {
            font-family: 'Montserrat', sans-serif;
            text-align: center;
        }
        :root {
            --primary-color: #00a676;
            --primary-hover: #00b88d;
            --danger-color: #dc2626;
            --danger-hover: #ef4444;
            --sidebar-bg: #f0f9f4;
            --sidebar-border: #a8d5c2;
            --white: #ffffff;
            --light-bg: #f8f9fa;
            --border-color: #adb5bd;
            --text-color: #495057;
            --text-light: #868e96;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --border-radius: 16px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        html {
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            overflow-x: hidden;
        }
        .header {
            background: var(--white);
            color: var(--text-color);
            padding: 0.5rem 1rem 0.5rem 0.5rem;
            border: 2px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 0;
            gap: 0.5rem;
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            flex-grow: 1;
            color: var(--primary-color);
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            flex: none;
            margin: 0;
            z-index: 0;
        }
        .back-btn {
            padding: 0.8rem 1.5rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            background: var(--sidebar-bg);
            color: var(--text-color);
            text-decoration: none;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
            z-index: 1;
        }
        .back-btn:hover {
            background: var(--primary-color);
            color: var(--white);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .logo-container {
            width: 100px;
            height: 80px;
            background: var(--white);
            border-radius: var(--border-radius);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            border: 2px solid var(--sidebar-border);
            position: relative;
            z-index: 1;
        }
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: var(--transition);
        }
        .logo-container:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-md);
        }
        .logo-container:hover img {
            transform: scale(1.05);
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .messages {
            margin-bottom: 1.5rem;
        }
        .messages .success {
            background: #d4edda;
            color: var(--primary-color);
            padding: 0.75rem;
            border-radius: 8px;
            border-left: 4px solid var(--primary-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 2px solid var(--border-color);
        }
        .messages .error {
            background: #fef2f2;
            color: #dc3545;
            padding: 0.75rem;
            border-radius: 8px;
            border-left: 4px solid #dc3545;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 2px solid var(--border-color);
        }
        .back-buttons {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .back-student-btn, .back-dashboard-btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            background: var(--light-bg);
            color: var(--text-color);
            text-decoration: none;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 2px solid var(--border-color);
        }
        .back-student-btn:hover, .back-dashboard-btn:hover {
            background: var(--primary-color);
            color: var(--white);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
        .section {
            background: var(--light-bg);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            margin-bottom: 2rem;
            transition: var(--transition);
        }
        .section:hover {
            box-shadow: var(--shadow-md);
        }
        .subheading {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .subheading h3 {
            color: var(--primary-color);
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
        }
        .form-group.required label:after {
            content: " *";
            color: #dc2626;
        }
        label {
            display: block;
            color: var(--primary-color);
            font-size: 0.9rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
        }
        input, select, textarea {
            width: 100%;
            padding: 0.7rem;
            border: 2px solid var(--border-color);
            background: var(--white);
            border-radius: 8px;
            font-size: 0.9rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(0, 166, 118, 0.3);
        }
        textarea {
            resize: vertical;
        }
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }
        button {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .save-btn {
            background: var(--primary-color);
            color: var(--white);
            border: 2px solid var(--primary-color);
        }
        .save-btn:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .cancel-btn {
            background: var(--light-bg);
            color: var(--text-color);
            border: 2px solid var(--border-color);
        }
        .cancel-btn:hover {
            background: var(--primary-color);
            color: var(--white);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .icon {
            margin-right: 0.5rem;
        }
        .scroll-top-btn {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background: var(--primary-color);
            color: var(--white);
            padding: 1rem;
            border-radius: 50px;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            width: 50px;
            height: 50px;
            border: none;
            cursor: pointer;
        }
        .scroll-top-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        .scroll-top-btn.show {
            display: flex;
        }
        @media (max-width: 768px) {
            body {
                padding: 100px 10px 20px 10px;
            }
            .header {
                padding: 1rem;
            }
            .header h1 {
                font-size: 1.5rem;
            }
            .logo-container {
                width: 80px;
                height: 64px;
            }
            .back-buttons {
                flex-direction: column;
                gap: 0.75rem;
            }
            .grid {
                grid-template-columns: 1fr;
            }
            .form-actions {
                flex-direction: column;
            }
            .section {
                padding: 1.2rem;
            }
            .messages .success, .messages .error {
                font-size: 0.85rem;
            }
        }
        @media (max-width: 480px) {
            body {
                padding: 80px 5px 15px 5px;
            }
            .header {
                padding: 0.75rem;
                flex-direction: column;
                gap: 1rem;
            }
            .header h1 {
                font-size: 1.25rem;
            }
            .logo-container {
                width: 60px;
                height: 48px;
            }
            .back-buttons {
                gap: 0.75rem;
            }
            .section {
                padding: 1rem;
            }
            .messages .success, .messages .error {
                font-size: 0.8rem;
            }
            .back-student-btn, .back-dashboard-btn {
                padding: 0.5rem 0.8rem;
                font-size: 0.8rem;
            }
            .save-btn, .cancel-btn {
                padding: 0.6rem 0.8rem;
                font-size: 0.9rem;
            }
            .scroll-top-btn {
                bottom: 0.75rem;
                right: 0.75rem;
                width: 40px;
                height: 40px;
                font-size: 1rem;
                padding: 0.8rem;
            }
        }
        @media (hover: none) {
            .section:hover, .logo-container:hover, .back-btn:hover, .back-student-btn:hover, .back-dashboard-btn:hover, .save-btn:hover, .cancel-btn:hover, .scroll-top-btn:hover {
                transform: none;
                box-shadow: var(--shadow-sm);
            }
        }
        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
                animation: none !important;
            }
            html {
                scroll-behavior: auto;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="{% url 'admin_page' %}" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back To Main Dashboard
        </a>
        <h1>{{ title }}</h1>
        <a href="{% url 'admin_page' %}">
            <div class="logo-container">
                <img src="{% static 'users/images/adminlogo.jpg' %}" alt="School Logo">
            </div>
        </a>
    </div>
    <div class="container">
        <div class="back-buttons">
            <button class="back-student-btn cancel-btn" onclick="window.location.href='{% url 'view_edit_class' %}'">
                <i class="fas fa-arrow-left"></i> Back to Classes
            </button>
           
        </div>
        <div class="messages">
            {% if messages %}
                {% for message in messages %}
                    <div class="{% if message.tags == 'success' %}success{% else %}error{% endif %}">
                        <i class="fas {% if message.tags == 'success' %}fa-check-circle{% else %}fa-exclamation-circle{% endif %} icon"></i>
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        </div>
        <form method="POST" id="classForm">
            {% csrf_token %}
            <input type="hidden" name="class_name" id="class_name_hidden">
            <div class="section">
                <div class="subheading">
                    <h3><i class="fas fa-chalkboard-teacher"></i> Class Information</h3>
                </div>
                <div class="grid">
                    <div class="form-group required">
                        <label><i class="fas fa-chalkboard-teacher"></i> Class Number</label>
                        <input type="text" name="class_number" id="class_number" value="{{ class_number|default:'' }}" placeholder="Enter class number (e.g., 2)" required>
                    </div>
                    <div class="form-group required">
                        <label><i class="fas fa-layer-group"></i> Section</label>
                        <input type="text" name="section_name" id="section_name" value="{{ section_name|default:'' }}" placeholder="Enter section (e.g., A)" required>
                    </div>
                </div>
            </div>
            <div class="form-actions">
                <button type="button" class="cancel-btn" onclick="window.location.href='{% url 'view_edit_class' %}'">
                    <i class="fas fa-times"></i> Cancel
                </button>
                <button type="submit" class="save-btn">
                    <i class="fas fa-save"></i> Save
                </button>
            </div>
        </form>
    </div>
    <button class="scroll-top-btn" onclick="scrollToTop()">
        <i class="fas fa-chevron-up"></i>
    </button>
    <script>
        window.onscroll = function() {
            const btn = document.querySelector('.scroll-top-btn');
            if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
                btn.classList.add('show');
            } else {
                btn.classList.remove('show');
            }
        };
        function scrollToTop() {
            document.body.scrollTop = 0;
            document.documentElement.scrollTop = 0;
        }
        document.addEventListener('DOMContentLoaded', function() {
            const fullClassName = "{{ class_name|escapejs|default:'' }}";
            if (fullClassName) {
                const parts = fullClassName.split('-');
                const classNumberInput = document.getElementById('class_number');
                const sectionInput = document.getElementById('section_name');
                if (parts.length >= 2) {
                    classNumberInput.value = parts[0];
                    sectionInput.value = parts[1];
                }
            }
            {% for field, value in request.POST.items %}
                {% if value %}
                    const fieldInput = document.querySelector('[name="{{ field }}"]');
                    if (fieldInput && fieldInput.tagName === 'SELECT') {
                        fieldInput.value = '{{ value }}';
                    }
                {% endif %}
            {% endfor %}

            // Combine class number and section on form submit
            document.getElementById('classForm').addEventListener('submit', function(e) {
                const classNum = document.getElementById('class_number').value.trim();
                const section = document.getElementById('section_name').value.trim();
                if (classNum && section) {
                    document.getElementById('class_name_hidden').value = classNum + '-' + section.toUpperCase();
                } else {
                    e.preventDefault();
                    alert('Please fill both class number and section.');
                }
            });
        });
    </script>
</body>
</html>
