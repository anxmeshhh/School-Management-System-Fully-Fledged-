{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manavargal School Management System - {{ title }}</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            font-weight: 400;
            background: var(--white);
            min-height: 100vh;
            color: var(--text-color);
            padding: 80px 20px 40px 20px;
        }

        h1, h2, h3 {
            font-family: 'Montserrat', sans-serif;
        }

        :root {
            --primary-color: #00a676;
            --primary-hover: #00b88d;
            --sidebar-bg: #f0f9f4;
            --sidebar-border: #d1e7dd;
            --white: #ffffff;
            --light-bg: #f8f9fa;
            --border-color: #e9ecef;
            --text-color: #495057;
            --text-light: #868e96;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --border-radius: 16px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --dull-highlighter: #d4edda;
        }

        html {
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            overflow-x: hidden;
        }

        .header {
            background: var(--white);
            color: var(--text-color);
            padding: 0.5rem 1rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: var(--border-radius) var(--border-radius) 0 0;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            flex-grow: 1;
            color: var(--primary-color);
        }

        .back-btn {
            padding: 0.8rem 1.5rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            background: var(--sidebar-bg);
            color: var(--text-color);
            text-decoration: none;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-btn:hover {
            background: var(--primary-color);
            color: var(--white);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .logo-img {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            object-fit: cover;
            border: none;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .logo-img:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-md);
        }

        .container {
            background: var(--white);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-sm);
            padding: 2rem;
            margin-top: 80px;
            transition: var(--transition);
        }

        .container:hover {
            box-shadow: var(--shadow-md);
        }

        .back-buttons {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .back-student-btn, .back-dashboard-btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            background: var(--light-bg);
            color: var(--text-color);
            text-decoration: none;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid var(--border-color);
        }

        .back-student-btn:hover, .back-dashboard-btn:hover {
            background: var(--primary-color);
            color: var(--white);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .messages p {
            text-align: center;
            margin: 1rem 0;
            font-size: 0.9rem;
            color: #dc2626;
            background: rgba(255, 75, 75, 0.1);
            padding: 0.6rem;
            border-radius: 6px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .section {
            background: var(--light-bg);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            margin-bottom: 2rem;
            transition: var(--transition);
        }

        .section:hover {
            box-shadow: var(--shadow-md);
        }

        .subheading {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .subheading h3 {
            color: var(--primary-color);
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
        }

        .required label:after {
            content: " *";
            color: #dc2626;
        }

        label {
            display: block;
            color: var(--primary-color);
            font-size: 0.9rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.7rem;
            border: 2px solid var(--border-color);
            background: var(--white);
            border-radius: 8px;
            font-size: 0.9rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(0, 166, 118, 0.3);
        }

        textarea {
            resize: vertical;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        button {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .save-btn {
            background: var(--primary-color);
            color: var(--white);
            border: 2px solid var(--primary-color);
        }

        .save-btn:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .cancel-btn {
            background: var(--light-bg);
            color: var(--text-color);
            border: 2px solid var(--border-color);
        }

        .cancel-btn:hover {
            background: var(--primary-color);
            color: var(--white);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        @media (max-width: 768px) {
            body {
                padding: 70px 10px 20px 10px;
            }

            .header {
                padding: 1rem;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .container {
                padding: 1.5rem;
                margin-top: 70px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .back-buttons {
                flex-direction: column;
                gap: 0.75rem;
            }

            .form-actions {
                flex-direction: column;
            }

            .messages p {
                font-size: 0.85rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 60px 5px 15px 5px;
            }

            .header {
                padding: 0.75rem;
                flex-direction: column;
                gap: 1rem;
            }

            .header h1 {
                font-size: 1.25rem;
            }

            .container {
                padding: 1rem;
                margin-top: 100px;
                border-radius: 8px;
            }

            .section {
                padding: 1rem;
            }

            .messages p {
                font-size: 0.8rem;
            }
        }

        @media (hover: none) {
            .section:hover, .logo-img:hover, .back-btn:hover, .card:hover {
                transform: none;
                box-shadow: var(--shadow-sm);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
                animation: none !important;
            }

            html {
                scroll-behavior: auto;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="{% url 'admin_page' %}" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back To Main Dashboard
        </a>
        <h1>{{ title }}</h1>
        <a href="{% url 'admin_page' %}">
            <img src="{% static 'users/images/adminlogo.jpg' %}" alt="School Logo" class="logo-img">
        </a>
    </div>

    <div class="container">
        <div class="back-buttons">
            <button class="cancel-btn" onclick="window.location.href='{% url 'view_edit_class' %}'">
                <i class="fas fa-arrow-left"></i> Back to Classes
            </button>
            <button class="cancel-btn" onclick="window.location.href='{% url 'admin_page' %}'">
                <i class="fas fa-home"></i> Back to Dashboard
            </button>
        </div>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p class="{{ message.tags }}">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="section">
                <div class="subheading">
                    <h3><i class="fas fa-chalkboard-teacher"></i> Class Information</h3>
                </div>
                <div class="grid">
                    <div class="form-group required">
                        <label><i class="fas fa-chalkboard-teacher"></i> Class Name</label>
                        <input type="text" name="class_name" value="{{ class_name|default:'' }}" placeholder="Enter class name (e.g., 2-A)" required>
                    </div>
                </div>
            </div>
            <div class="form-actions">
                <button type="button" class="cancel-btn" onclick="window.location.href='{% url 'view_edit_class' %}'">
                    <i class="fas fa-times"></i> Cancel
                </button>
                <button type="submit" class="save-btn">
                    <i class="fas fa-save"></i> Save
                </button>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            {% for field, value in request.POST.items %}
                {% if value %}
                    const field = document.querySelector('[name="{{ field }}"]');
                    if (field && field.tagName === 'SELECT') {
                        field.value = '{{ value }}';
                    }
                {% endif %}
            {% endfor %}
        });
    </script>
</body>
</html>
