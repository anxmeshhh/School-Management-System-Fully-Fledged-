{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manavargal School Management System - Edit Timetable Entry</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            font-weight: 400;
            background: var(--white);
            min-height: 100vh;
            color: var(--text-color);
            line-height: 1.6;
            padding: 120px 20px 40px 20px;
        }

        h1, h2, h3 {
            font-family: 'Montserrat', sans-serif;
        }

        :root {
            --primary-color: #00a676;
            --primary-hover: #00b88d;
            --sidebar-bg: #f0f9f4;
            --sidebar-border: #a8d5c2;
            --white: #ffffff;
            --light-bg: #f8f9fa;
            --border-color: #adb5bd;
            --text-color: #495057;
            --text-light: #868e96;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --border-radius: 16px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            overflow-x: hidden;
        }

        .header {
            background: var(--white);
            color: var(--text-color);
            padding: 1rem 1.5rem;
            border: 2px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 0;
            gap: 1rem;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            flex-grow: 1;
            color: var(--primary-color);
            margin: 0;
            white-space: nowrap;
        }

        .back-btn {
            padding: 0.8rem 1.5rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            background: var(--sidebar-bg);
            color: var(--text-color);
            text-decoration: none;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
            z-index: 1;
        }

        .back-btn:hover {
            background: var(--primary-color);
            color: var(--white);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .logo-container {
            width: 100px;
            height: 80px;
            background: var(--white);
            border-radius: var(--border-radius);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            border: 2px solid var(--sidebar-border);
            position: relative;
            z-index: 1;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: var(--transition);
        }

        .logo-container:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-md);
        }

        .logo-container:hover img {
            transform: scale(1.05);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .form-header {
            color: var(--primary-color);
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 2rem;
            text-align: center;
            padding: 1rem 0;
        }

        .form-container {
            background: var(--white);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 2.5rem;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            margin-bottom: 2rem;
        }

        .form-container:hover {
            box-shadow: var(--shadow-md);
        }

        .form-group {
            margin-bottom: 1.75rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-color);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: var(--transition);
            background: var(--light-bg);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            background: var(--white);
            box-shadow: 0 0 0 3px rgba(0, 166, 118, 0.1);
        }

        .form-row {
            display: flex;
            gap: 1.5rem;
            align-items: flex-end;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .form-row .form-group {
            flex: 1;
            min-width: 200px;
        }

        .btn {
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            margin-right: 1rem;
        }

        .btn-primary {
            background: var(--primary-color);
            color: var(--white);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--sidebar-bg);
            color: var(--text-color);
            border: 2px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--primary-color);
            color: var(--white);
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .messages {
            margin-bottom: 2rem;
            max-width: 600px;
        }

        .messages .success,
        .messages .error {
            padding: 1rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border: 2px solid var(--border-color);
            margin-bottom: 1rem;
        }

        .messages .success {
            background: #d4edda;
            color: var(--primary-color);
            border-left: 4px solid var(--primary-color);
        }

        .messages .error {
            background: #fef2f2;
            color: #dc3545;
            border-left: 4px solid #dc3545;
        }

        .icon {
            margin-right: 0.5rem;
            font-size: 1.1rem;
        }

        .scroll-top-btn {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background: var(--primary-color);
            color: var(--white);
            padding: 1rem;
            border-radius: 50px;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            width: 50px;
            height: 50px;
            border: none;
            cursor: pointer;
        }

        .scroll-top-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .scroll-top-btn.show {
            display: flex;
        }

        @media (max-width: 768px) {
            body {
                padding: 100px 10px 20px 10px;
            }

            .header {
                padding: 1rem;
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .header h1 {
                font-size: 1.5rem;
                position: static;
                transform: none;
                flex-grow: 1;
                text-align: center;
            }

            .logo-container {
                width: 80px;
                height: 64px;
            }

            .form-header {
                font-size: 1.5rem;
                margin-bottom: 1.5rem;
            }

            .form-container {
                padding: 1.5rem;
            }

            .form-group input,
            .form-group select {
                padding: 0.75rem;
                font-size: 0.9rem;
            }

            .form-row {
                flex-direction: column;
                gap: 1rem;
            }

            .form-row .form-group {
                min-width: auto;
            }

            .btn {
                padding: 0.75rem 1.5rem;
                font-size: 0.9rem;
                margin-right: 0.5rem;
                width: 100%;
                justify-content: center;
            }

            .back-btn {
                padding: 0.6rem 1rem;
                font-size: 0.9rem;
                width: 100%;
                justify-content: center;
            }

            .scroll-top-btn {
                bottom: 1rem;
                right: 1rem;
                width: 45px;
                height: 45px;
                font-size: 1.1rem;
                padding: 0.9rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 80px 5px 15px 5px;
            }

            .header {
                padding: 0.75rem;
                flex-direction: column;
                gap: 1rem;
            }

            .header h1 {
                font-size: 1.25rem;
            }

            .logo-container {
                width: 60px;
                height: 48px;
            }

            .form-header {
                font-size: 1.3rem;
                margin-bottom: 1rem;
            }

            .form-container {
                padding: 1rem;
            }

            .form-group input,
            .form-group select {
                padding: 0.5rem;
                font-size: 0.85rem;
            }

            .form-row {
                gap: 0.75rem;
            }

            .btn {
                padding: 0.5rem 1rem;
                font-size: 0.8rem;
                margin-right: 0;
                margin-bottom: 0.5rem;
                width: 100%;
                justify-content: center;
            }

            .back-btn {
                padding: 0.5rem 0.8rem;
                font-size: 0.8rem;
            }

            .scroll-top-btn {
                bottom: 0.75rem;
                right: 0.75rem;
                width: 40px;
                height: 40px;
                font-size: 1rem;
                padding: 0.8rem;
            }
        }

        @media (hover: none) {
            .form-container:hover, .logo-container:hover, .back-btn:hover, .scroll-top-btn:hover, .btn:hover {
                transform: none;
                box-shadow: var(--shadow-sm);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
                animation: none !important;
            }

            html {
                scroll-behavior: auto;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="{% url 'teacher_timetable' %}" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back to Timetable
        </a>
        <h1><i class="fas fa-edit"></i> Edit Timetable Entry</h1>
        <a href="{% url 'teacher_dashboard' %}">
            <div class="logo-container">
                <img src="{% static 'users/images/adminlogo.jpg' %}" alt="School Logo">
            </div>
        </a>
    </header>

    <div class="container">
        <h2 class="form-header">
            
        </h2>

        <div class="messages">
            {% if messages %}
                {% for message in messages %}
                    <div class="{{ message.tags }}">
                        <i class="fas {% if message.tags == 'error' %}fa-exclamation-circle{% elif message.tags == 'success' %}fa-check-circle{% else %}fa-exclamation-triangle{% endif %} icon"></i>
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        </div>

        <div class="form-container">
            <form method="post" action="{% url 'teacher_timetable_edit' timetable.id %}">
                {% csrf_token %}
                <input type="hidden" name="id" value="{{ timetable.id }}">
                <div class="form-row">
                    <div class="form-group">
                        <label for="class"><i class="fas fa-graduation-cap"></i> Class:</label>
                        <select id="class" name="class" required>
                            <option value="">Select Class</option>
                            {% for cls in classes %}
                                <option value="{{ cls }}" {% if cls == timetable.class %}selected{% endif %}>{{ cls }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="section"><i class="fas fa-th-large"></i> Section:</label>
                        <select id="section" name="section">
                            <option value="">No Section</option>
                            {% for sec in sections %}
                                <option value="{{ sec }}" {% if sec == timetable.section %}selected{% endif %}>{{ sec|capfirst }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="subject"><i class="fas fa-book"></i> Subject:</label>
                        <input type="text" id="subject" name="subject" value="{{ timetable.subject }}" required placeholder="e.g., Mathematics">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="day_of_week"><i class="fas fa-calendar-day"></i> Day of Week:</label>
                        <select id="day_of_week" name="day_of_week" required>
                            <option value="">Select Day</option>
                            <option value="Monday" {% if timetable.day_of_week == 'Monday' %}selected{% endif %}>Monday</option>
                            <option value="Tuesday" {% if timetable.day_of_week == 'Tuesday' %}selected{% endif %}>Tuesday</option>
                            <option value="Wednesday" {% if timetable.day_of_week == 'Wednesday' %}selected{% endif %}>Wednesday</option>
                            <option value="Thursday" {% if timetable.day_of_week == 'Thursday' %}selected{% endif %}>Thursday</option>
                            <option value="Friday" {% if timetable.day_of_week == 'Friday' %}selected{% endif %}>Friday</option>
                            <option value="Saturday" {% if timetable.day_of_week == 'Saturday' %}selected{% endif %}>Saturday</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="start_time"><i class="fas fa-clock"></i> Start Time:</label>
                        <input type="time" id="start_time" name="start_time" value="{{ timetable.start_time|time:'H:i' }}" required>
                    </div>
                    <div class="form-group">
                        <label for="end_time"><i class="fas fa-clock"></i> End Time:</label>
                        <input type="time" id="end_time" name="end_time" value="{{ timetable.end_time|time:'H:i' }}" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="room"><i class="fas fa-door-open"></i> Room (Optional):</label>
                        <input type="text" id="room" name="room" value="{{ timetable.room|default:'' }}" placeholder="e.g., Room 101">
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Update Entry
                        </button>
                        <a href="{% url 'teacher_timetable' %}" class="btn btn-secondary">
                            <i class="fas fa-times"></i> Cancel
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <button class="scroll-top-btn" onclick="scrollToTop()">
        <i class="fas fa-chevron-up"></i>
    </button>

    <script>
        window.onscroll = function() {
            const btn = document.querySelector('.scroll-top-btn');
            if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
                btn.classList.add('show');
            } else {
                btn.classList.remove('show');
            }
        };

        function scrollToTop() {
            document.body.scrollTop = 0;
            document.documentElement.scrollTop = 0;
        }
    </script>
</body>
</html>
