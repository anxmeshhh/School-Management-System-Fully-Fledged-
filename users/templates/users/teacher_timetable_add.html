{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manavargal School Management System - Add Teacher Timetable Entry</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            font-weight: 400;
            background: var(--white);
            min-height: 100vh;
            color: var(--text-color);
            padding: 120px 20px 40px 20px;
        }

        h1, h2, h3 {
            font-family: 'Montserrat', sans-serif;
        }

        :root {
            --primary-color: #00a676;
            --primary-hover: #00b88d;
            --sidebar-bg: #f0f9f4;
            --sidebar-border: #a8d5c2;
            --white: #ffffff;
            --light-bg: #f8f9fa;
            --border-color: #adb5bd;
            --text-color: #495057;
            --text-light: #868e96;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --border-radius: 16px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            overflow-x: hidden;
        }

        .header {
            background: var(--white);
            color: var(--text-color);
            padding: 0.5rem 1rem 0.5rem 0.5rem;
            border: 2px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 0;
            gap: 0.5rem;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            flex-grow: 1;
            color: var(--primary-color);
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            flex: none;
            margin: 0;
            z-index: 0;
        }

        .back-btn {
            padding: 0.8rem 1.5rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            background: var(--sidebar-bg);
            color: var(--text-color);
            text-decoration: none;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
            z-index: 1;
        }

        .back-btn:hover {
            background: var(--primary-color);
            color: var(--white);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .logo-container {
            width: 100px;
            height: 80px;
            background: var(--white);
            border-radius: var(--border-radius);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            border: 2px solid var(--sidebar-border);
            position: relative;
            z-index: 1;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: var(--transition);
        }

        .logo-container:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-md);
        }

        .logo-container:hover img {
            transform: scale(1.05);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .form-header {
            color: var(--primary-color);
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .form-container {
            background: var(--white);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 2rem;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .form-container:hover {
            box-shadow: var(--shadow-md);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-color);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: var(--transition);
            background: var(--light-bg);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            background: var(--white);
            box-shadow: 0 0 0 3px rgba(0, 166, 118, 0.1);
        }

        .btn {
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            margin-right: 1rem;
        }

        .btn-primary {
            background: var(--primary-color);
            color: var(--white);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--sidebar-bg);
            color: var(--text-color);
            border: 2px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--primary-color);
            color: var(--white);
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .messages {
            margin-bottom: 1.5rem;
        }

        .messages .success {
            background: #d4edda;
            color: var(--primary-color);
            padding: 0.75rem;
            border-radius: 8px;
            border-left: 4px solid var(--primary-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 2px solid var(--border-color);
        }

        .messages .error {
            background: #fef2f2;
            color: #dc3545;
            padding: 0.75rem;
            border-radius: 8px;
            border-left: 4px solid #dc3545;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 2px solid var(--border-color);
        }

        .icon {
            margin-right: 0.5rem;
        }

        .scroll-top-btn {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background: var(--primary-color);
            color: var(--white);
            padding: 1rem;
            border-radius: 50px;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            width: 50px;
            height: 50px;
            border: none;
            cursor: pointer;
        }

        .scroll-top-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .scroll-top-btn.show {
            display: flex;
        }

        @media (max-width: 768px) {
            body {
                padding: 100px 10px 20px 10px;
            }

            .header {
                padding: 1rem;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .logo-container {
                width: 80px;
                height: 64px;
            }

            .form-header {
                font-size: 1.5rem;
                margin-bottom: 1.25rem;
            }

            .form-container {
                padding: 1.5rem;
            }

            .form-group input,
            .form-group select {
                padding: 0.75rem;
                font-size: 0.9rem;
            }

            .btn {
                padding: 0.75rem 1.5rem;
                font-size: 0.9rem;
                margin-right: 0.5rem;
            }

            .back-btn {
                padding: 0.6rem 1rem;
                font-size: 0.9rem;
            }

            .scroll-top-btn {
                bottom: 1rem;
                right: 1rem;
                width: 45px;
                height: 45px;
                font-size: 1.1rem;
                padding: 0.9rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 80px 5px 15px 5px;
            }

            .header {
                padding: 0.75rem;
                flex-direction: column;
                gap: 1rem;
            }

            .header h1 {
                font-size: 1.25rem;
            }

            .logo-container {
                width: 60px;
                height: 48px;
            }

            .form-header {
                font-size: 1.3rem;
                margin-bottom: 1rem;
            }

            .form-container {
                padding: 1rem;
            }

            .form-group input,
            .form-group select {
                padding: 0.5rem;
                font-size: 0.85rem;
            }

            .btn {
                padding: 0.5rem 1rem;
                font-size: 0.8rem;
                margin-right: 0;
                margin-bottom: 0.5rem;
                width: 100%;
                justify-content: center;
            }

            .back-btn {
                padding: 0.5rem 0.8rem;
                font-size: 0.8rem;
            }

            .scroll-top-btn {
                bottom: 0.75rem;
                right: 0.75rem;
                width: 40px;
                height: 40px;
                font-size: 1rem;
                padding: 0.8rem;
            }
        }

        @media (hover: none) {
            .form-container:hover, .logo-container:hover, .back-btn:hover, .scroll-top-btn:hover, .btn:hover {
                transform: none;
                box-shadow: var(--shadow-sm);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
                animation: none !important;
            }

            html {
                scroll-behavior: auto;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="{% url 'teacher_timetable' %}" class="back-btn">  <!-- Fixed URL name -->
            <i class="fas fa-arrow-left"></i> Back to Timetable
        </a>
        <h1><i class="fas fa-plus-circle"></i> Add Timetable Entry</h1>
        <a href="{% url 'teacher_dashboard' %}">
            <div class="logo-container">
                <img src="{% static 'users/images/adminlogo.jpg' %}" alt="School Logo">
            </div>
        </a>
    </header>

    <div class="container">
        <h2 class="form-header">
            
        </h2>

        <div class="messages">
            {% if messages %}
                {% for message in messages %}
                    <div class="{{ message.tags }}">
                        <i class="fas {% if message.tags == 'error' %}fa-exclamation-circle{% elif message.tags == 'success' %}fa-check-circle{% else %}fa-exclamation-triangle{% endif %} icon"></i>
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        </div>

        <div class="form-container">
            <form method="post" action="{% url 'teacher_timetable_add' %}">  <!-- Correct self-reference -->
                {% csrf_token %}
                <div class="form-group">
                    <label for="class">Class:</label>
                    <select name="class" id="class" required>
                        <option value="">Select Class</option>
                        {% for cls in classes %}
                            <option value="{{ cls }}">{{ cls }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="section">Section (Optional):</label>
                    <select name="section" id="section">
                        <option value="">No Section</option>
                        {% for sec in sections %}
                            <option value="{{ sec }}">{{ sec }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="subject">Subject:</label>
                    <input type="text" name="subject" id="subject" required placeholder="e.g., Mathematics">
                </div>
                <div class="form-group">
                    <label for="day_of_week">Day of Week:</label>
                    <select name="day_of_week" id="day_of_week" required>
                        <option value="">Select Day</option>
                        <option value="Monday">Monday</option>
                        <option value="Tuesday">Tuesday</option>
                        <option value="Wednesday">Wednesday</option>
                        <option value="Thursday">Thursday</option>
                        <option value="Friday">Friday</option>
                        <option value="Saturday">Saturday</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="start_time">Start Time:</label>
                    <input type="time" name="start_time" id="start_time" required>
                </div>
                <div class="form-group">
                    <label for="end_time">End Time:</label>
                    <input type="time" name="end_time" id="end_time" required>
                </div>
                <div class="form-group">
                    <label for="room">Room (Optional):</label>
                    <input type="text" name="room" id="room" placeholder="e.g., Room 101">
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Add Entry
                    </button>
                    <a href="{% url 'teacher_timetable' %}" class="btn btn-secondary">  <!-- Fixed URL name -->
                        <i class="fas fa-times"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>

    <button class="scroll-top-btn" onclick="scrollToTop()">
        <i class="fas fa-chevron-up"></i>
    </button>

    <script>
        window.onscroll = function() {
            const btn = document.querySelector('.scroll-top-btn');
            if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
                btn.classList.add('show');
            } else {
                btn.classList.remove('show');
            }
        };

        function scrollToTop() {
            document.body.scrollTop = 0;
            document.documentElement.scrollTop = 0;
        }
    </script>
</body>
</html>
