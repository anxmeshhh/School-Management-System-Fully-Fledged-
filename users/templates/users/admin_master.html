{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manavargal School Management System - Admin Master Data</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500&display=swap');

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Poppins', sans-serif;
        font-weight: 400;
        background: var(--white);
        min-height: 100vh;
        color: var(--text-color);
        padding-top: 100px;
        padding-bottom: 40px;
    }

    h1, h2, h3 {
        font-family: 'Montserrat', sans-serif;
        text-align: center;
    }

    :root {
        --primary-color: #00a676;
        --primary-hover: #00b88d;
        --sidebar-bg: #f0f9f4;
        --sidebar-border: #a8d5c2;
        --white: #ffffff;
        --light-bg: #f8f9fa;
        --border-color: #adb5bd;
        --text-color: #495057;
        --text-light: #868e96;
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        --border-radius: 16px;
        --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html {
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
        overflow-x: hidden;
    }

    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
    }

    .header {
        background: var(--white);
        color: var(--text-color);
        padding: 0.75rem 1rem;
        border-bottom: 2px solid var(--border-color);
        box-shadow: var(--shadow-md);
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
    }

    .header h1 {
        font-size: 1.75rem;
        font-weight: 700;
        text-align: center;
        flex-grow: 1;
        color: var(--primary-color);
        margin: 0;
        margin-left: -10%;  /* Shifts the title slightly left for better balance */
    }

    .back-btn {
        padding: 0.6rem 1.2rem;
        border: 2px solid var(--border-color);
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
        background: var(--sidebar-bg);
        color: var(--text-color);
        text-decoration: none;
        transition: var(--transition);
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        white-space: nowrap;
    }

    .back-btn:hover {
        background: var(--primary-color);
        color: var(--white);
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
    }

    .logo-container {
        width: 90px;
        height: 70px;
        background: var(--white);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        transition: var(--transition);
        box-shadow: var(--shadow-sm);
        border: 2px solid var(--sidebar-border);
        flex-shrink: 0;
    }

    .logo-container img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        transition: var(--transition);
    }

    .logo-container:hover {
        transform: scale(1.05);
        box-shadow: var(--shadow-md);
    }

    .main-content {
        background: var(--white);
        border: 2px solid var(--border-color);
        border-radius: var(--border-radius);
        box-shadow: var(--shadow-sm);
        padding: 2rem;
        margin-top: 20px;
    }

    .alert-message {
        margin-bottom: 1.5rem;
    }

    .alert-message .error {
        background: #fef2f2;
        color: #dc3545;
        padding: 0.75rem;
        border-radius: 8px;
        border-left: 4px solid #dc3545;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        border: 2px solid var(--border-color);
    }

    .alert-message .success {
        background: #d4edda;
        color: var(--primary-color);
        padding: 0.75rem;
        border-radius: 8px;
        border-left: 4px solid var(--primary-color);
        display: flex;
        align-items: center;
        gap: 0.5rem;
        border: 2px solid var(--border-color);
    }

    .alert-message .warning {
        background: #fff3cd;
        color: #856404;
        padding: 0.75rem;
        border-radius: 8px;
        border-left: 4px solid #ffc107;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        border: 2px solid var(--border-color);
    }

    .section {
        background: var(--light-bg);
        padding: 1.5rem;
        border-radius: 12px;
        border: 2px solid var(--border-color);
        box-shadow: var(--shadow-sm);
        margin-bottom: 2rem;
        transition: var(--transition);
    }

    .section:hover {
        box-shadow: var(--shadow-md);
    }

    h2 {
        color: var(--primary-color);
        font-size: 1.75rem;
        font-weight: 600;
        margin-bottom: 1.5rem;
        text-align: center;
    }

    .cards-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1.5rem;
        margin-top: 1rem;
    }

    .card {
        background: var(--white);
        padding: 1.5rem;
        border-radius: var(--border-radius);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        cursor: pointer;
        transition: var(--transition);
        box-shadow: var(--shadow-sm);
        border: 2px solid var(--border-color);
        min-height: 120px;
        text-decoration: none;
        color: inherit;
    }

    .card:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-md);
    }

    .card img {
        width: 80px;
        height: 80px;
        margin-bottom: 1rem;
        transition: var(--transition);
        flex-shrink: 0;
    }

    .card:hover img {
        transform: scale(1.1);
    }

    .card span {
        color: var(--text-color);
        font-size: 1.125rem;
        font-weight: 500;
    }

    @media (max-width: 768px) {
        body {
            padding-top: 140px;
        }

        .header {
            flex-wrap: wrap;
            padding: 0.75rem;
            gap: 0.75rem;
        }

        .header h1 {
            font-size: 1.25rem;
            order: 1;
            width: 100%;
        }

        .back-btn {
            order: 2;
            flex: 1;
            justify-content: center;
            padding: 0.6rem 1rem;
            font-size: 0.9rem;
        }

        .logo-container {
            order: 3;
            width: 60px;
            height: 50px;
        }

        .container {
            padding: 0 15px;
        }

        .main-content {
            padding: 1.5rem;
        }

        .section {
            padding: 1.2rem;
        }

        h2 {
            font-size: 1.3rem;
        }

        .cards-grid {
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }

        .card {
            padding: 1.2rem;
            min-height: 100px;
        }

        .card img {
            width: 60px;
            height: 60px;
        }

        .card span {
            font-size: 1rem;
        }
    }

    @media (max-width: 480px) {
        body {
            padding-top: 160px;
        }

        .header {
            padding: 0.5rem;
        }

        .header h1 {
            font-size: 1.1rem;
        }

        .logo-container {
            width: 50px;
            height: 45px;
        }

        .main-content {
            padding: 1rem;
            border-radius: 8px;
        }

        .section {
            padding: 1rem;
        }

        h2 {
            font-size: 1.15rem;
        }

        .cards-grid {
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        .card {
            padding: 1rem;
            min-height: 100px;
        }

        .card img {
            width: 50px;
            height: 50px;
        }

        .card span {
            font-size: 0.9rem;
        }

        .back-btn {
            padding: 0.5rem 0.8rem;
            font-size: 0.85rem;
        }
    }

    @media (hover: none) {
        .section:hover, .card:hover, .logo-container:hover, .back-btn:hover {
            transform: none;
            box-shadow: var(--shadow-sm);
        }
    }

    @media (prefers-reduced-motion: reduce) {
        * {
            transition: none !important;
            animation: none !important;
        }

        html {
            scroll-behavior: auto;
        }
    }
</style>
</head>
<body>
    <header class="header">
        <a href="{% url 'admin_dashboard' %}" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back To Main Dashboard
        </a>
        <h1><i class="fas fa-database"></i> Admin Master Data</h1>
        <a href="{% url 'admin_dashboard' %}">
            <div class="logo-container">
                <img src="{% static 'users/images/adminlogo.jpg' %}" alt="Manavargal Logo">
            </div>
        </a>
    </header>

    <div class="container">
        <main class="main-content">
            

            <section class="section">
                <h2><i class="fas fa-cogs"></i> Master Data Management</h2>
                <div class="cards-grid">
                    <a href="{% url 'view_edit_class' %}" class="card">
                        <img src="https://img.icons8.com/color/70/000000/classroom.png" alt="Add Class">
                        <span>Add Class</span>
                    </a>
                    <a href="{% url 'student_info' %}" class="card">
                        <img src="https://img.icons8.com/color/70/000000/graduation-cap.png" alt="Student Info">
                        <span>Student Master Data</span>
                    </a>
                    <a href="{% url 'add_student' %}" class="card">
                        <img src="https://img.icons8.com/color/70/000000/add-user-male.png" alt="Add New Student">
                        <span>Add New Student</span>
                    </a>
                    <a href="{% url 'manage_users' %}" class="card">
                        <img src="https://img.icons8.com/color/70/000000/user-group-man-woman.png" alt="Manage Users">
                        <span>Manage Users</span>
                    </a>
                    <a href="{% url 'qr_scan' %}" class="card">
                        <img src="https://img.icons8.com/ios-filled/50/000000/qr-code.png" alt="Scan QR">
                        <span>QR CODEit</span>
                    </a>
                    <a href="{% url 'bulk_id_card' %}" class="card">
                        <img src="https://img.icons8.com/color/70/000000/id-verified.png" alt="Bulk ID Card Generation">
                        <span>Bulk ID Card Generation</span>
                    </a>
                    <a href="{% url 'bulk_upload' %}" class="card">
                        <img src="https://img.icons8.com/color/70/000000/upload.png" alt="Bulk Upload Icon">
                        <span>Bulk Student Upload</span>
                    </a>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
