<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin – Send Student PDF via WhatsApp</title>

    <!-- CSRF token for JS -->
    <meta name="csrf-token" content="{{ csrf_token }}">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }
        .card {
            max-width: 720px;
            margin: 40px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h2 {
            margin-bottom: 10px;
        }
        select, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }
        button {
            background: #25D366;
            border: none;
            color: white;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            opacity: 0.9;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        th {
            background: #f0f0f0;
        }
        .muted {
            color: #777;
            font-size: 13px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>Admin – Send Student PDF via WhatsApp</h2>
    <p class="muted">
        This tool opens WhatsApp with a pre-filled message.<br>
        The PDF is generated <b>at the time of sending</b>.<br>
        Admin must manually click <b>Send</b> in WhatsApp.
    </p>

    <!-- Class & Section Selection -->
    <select id="classSelect">
        <option value="">Select Class</option>
        <option value="11">Class 11</option>
        <option value="12">Class 12</option>
    </select>

    <select id="sectionSelect">
        <option value="">Select Section</option>
        <option value="A">Section A</option>
        <option value="B">Section B</option>
        <option value="C">Section C</option>
    </select>

    <button onclick="loadStudents()">Fetch Students</button>

    <!-- Students Table -->
    <table id="studentsTable" style="display:none;">
        <thead>
            <tr>
                <th>Name</th>
                <th>Admission No</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="studentsBody"></tbody>
    </table>
</div>

<script>
const fetchStudentsUrl = "{% url 'fetch_students' %}";
const generateWaLinkUrl = "{% url 'generate_whatsapp_link' %}";
const csrfToken = document.querySelector('meta[name="csrf-token"]').content;

function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text || "";
    return div.innerHTML;
}

function loadStudents() {
    const cls = document.getElementById("classSelect").value;
    const sec = document.getElementById("sectionSelect").value;

    if (!cls || !sec) {
        alert("Please select both class and section");
        return;
    }

    fetch(`${fetchStudentsUrl}?class=${encodeURIComponent(cls)}&section=${encodeURIComponent(sec)}`)
        .then(res => res.json())
        .then(data => {
            const tbody = document.getElementById("studentsBody");
            tbody.innerHTML = "";

            if (!data.students || data.students.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3">No students found</td></tr>`;
            } else {
                data.students.forEach(s => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${escapeHtml(s.name)}</td>
                            <td>${escapeHtml(s.admission_number)}</td>
                            <td>
                                <button onclick="sendWA(
                                    '${encodeURIComponent(s.id)}',
                                    '${encodeURIComponent(s.name)}',
                                    '${encodeURIComponent(s.admission_number || '')}',
                                    '${encodeURIComponent(s.contact || '')}',
                                    this
                                )">
                                    Send WhatsApp
                                </button>
                            </td>
                        </tr>
                    `;
                });
            }

            document.getElementById("studentsTable").style.display = "table";
        })
        .catch(err => {
            console.error(err);
            alert("Error loading students");
        });
}

function sendWA(idEnc, nameEnc, admissionEnc, contactEnc, btn) {
    const student_id = decodeURIComponent(idEnc);
    const name = decodeURIComponent(nameEnc);
    const admission = decodeURIComponent(admissionEnc);
    const contact = decodeURIComponent(contactEnc);

    let mobile = prompt("Enter WhatsApp Number", contact || "");
    if (!mobile) return;

    mobile = mobile.replace(/\s+/g, "");

    if (!/^\d{10,15}$/.test(mobile)) {
        alert("Please enter a valid WhatsApp number (digits only)");
        return;
    }

    btn.disabled = true;

    fetch(generateWaLinkUrl, {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-CSRFToken": csrfToken
        },
        body: new URLSearchParams({
            mobile: mobile,
            name: name,
            admission_number: admission,
            student_id: student_id
        })
    })
    .then(res => res.json())
    .then(data => {
        btn.disabled = false;
        if (data.whatsapp_url) {
            window.open(data.whatsapp_url, "_blank");
        } else {
            alert(data.error || "Failed to generate WhatsApp link");
        }
    })
    .catch(err => {
        btn.disabled = false;
        console.error(err);
        alert("Failed to open WhatsApp");
    });
}
</script>

</body>
</html>
